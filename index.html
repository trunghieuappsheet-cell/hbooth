<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro PhotoBooth - Studio Giao Diện Đơn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body { background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; }
    
    /* Layout chính chia 2 cột cố định */
    .app-container { display: flex; height: 100vh; }
    
    /* Cột trái: Hiển thị & Thao tác (Cố định) */
    .left-panel { flex: 6; padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #333; background: #1a1a1a; }
    
    /* Cột phải: Cài đặt (Cuộn dọc) */
    .right-panel { flex: 4; padding: 20px; overflow-y: auto; background: #121212; }
    .right-panel::-webkit-scrollbar { width: 6px; }
    .right-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

    .control-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card-title { font-size: 1rem; font-weight: 600; color: #e0e0e0; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 12px; }

    /* Khu vực Camera & Fullscreen */
    .viewport-wrapper { position: relative; width: 100%; flex-grow: 1; background: #000; border-radius: 8px; overflow: hidden; border: 2px solid #333; display: flex; align-items: center; justify-content: center; }
    #videoElement { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    #countdownOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 150px; font-weight: bold; color: white; text-shadow: 0 0 20px rgba(0,0,0,0.8); z-index: 50; display: none; }
    .btn-rotate-cam { position: absolute; top: 15px; right: 15px; z-index: 10; border-radius: 50%; width: 40px; height: 40px; opacity: 0.7; }
    .btn-rotate-cam:hover { opacity: 1; }

    /* Thư viện ảnh thu nhỏ */
    .gallery-container { height: 120px; display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; border-top: 1px solid #333; margin-top: 15px; }
    .thumb-item { width: 70px; height: 100px; object-fit: cover; border: 2px solid #0d6efd; border-radius: 4px; cursor: pointer; }
    .thumb-item:hover { filter: brightness(0.8); border-color: #dc3545; }

    /* Thanh tiến độ Upload ngầm */
    .upload-status { font-size: 0.85rem; display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .progress { height: 8px; background-color: #333; border-radius: 4px; flex-grow: 1; margin: 0 10px; }
    .progress-bar { background-color: #198754; transition: width 0.3s; }

    /* Canvas In (Ẩn đi, chỉ hiện khi in) */
    #finalCanvas { display: none; }
    
    @media print {
      @page { size: 4in 6in; margin: 0; }
      body * { visibility: hidden; }
      #finalCanvas { display: block; visibility: visible; position: fixed; left: 0; top: 0; width: 4in; height: 6in; object-fit: cover; z-index: 9999; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- CỘT TRÁI: CAMERA VÀ QUẢN LÝ ẢNH -->
    <div class="left-panel">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0 fw-bold"><i class="bi bi-camera-fill text-primary"></i> Live Camera</h4>
        <select id="cameraSelect" class="form-select form-select-sm w-auto bg-dark text-white border-secondary" onchange="app.switchCamera()"></select>
      </div>

      <div class="viewport-wrapper" id="viewport">
        <button class="btn btn-dark btn-rotate-cam" onclick="app.toggleCameraRotation()" title="Xoay phần cứng Camera">
          <i class="bi bi-phone-flip"></i>
        </button>
        <video id="videoElement" autoplay playsinline></video>
        <div id="countdownOverlay">3</div>
      </div>

      <div class="d-flex justify-content-center mt-4 mb-2 gap-3">
        <button class="btn btn-primary btn-lg px-5 fw-bold shadow rounded-pill" onclick="app.startCaptureSession()">
          <i class="bi bi-play-circle-fill me-2"></i> BẮT ĐẦU CHỤP
        </button>
        <button class="btn btn-success btn-lg px-4 fw-bold shadow rounded-pill" onclick="app.print()">
          <i class="bi bi-printer me-2"></i> IN ẢNH
        </button>
      </div>

      <!-- Upload Progress -->
      <div class="upload-status text-muted">
        <span><i class="bi bi-cloud-upload"></i> Đang tải lên: <span id="uploadCount">0/0</span></span>
        <div class="progress">
          <div class="progress-bar" id="uploadProgress" style="width: 0%"></div>
        </div>
        <span id="uploadStatusText">Sẵn sàng</span>
      </div>

      <div class="gallery-container" id="galleryContainer"></div>
    </div>

    <!-- CỘT PHẢI: BẢNG ĐIỀU KHIỂN & CÀI ĐẶT -->
    <div class="right-panel">
      
      <div class="control-card">
        <h5 class="card-title"><i class="bi bi-stopwatch"></i> Bộ đếm & Chế độ chụp</h5>
        <div class="row g-2">
          <div class="col-6">
            <label class="small text-muted">Số lượng ảnh/lượt</label>
            <input type="number" id="photoCount" class="form-control form-control-sm" value="4" min="1" max="16">
          </div>
          <div class="col-6">
            <label class="small text-muted">Đếm ngược (giây)</label>
            <input type="number" id="timerCount" class="form-control form-control-sm" value="3" min="0" max="10">
          </div>
        </div>
      </div>

      <div class="control-card">
        <h5 class="card-title"><i class="bi bi-grid-3x3"></i> Bố cục Trang in (Canon 4x6)</h5>
        <select id="layoutSelect" class="form-select form-select-sm mb-2" onchange="app.renderLayout()">
          <option value="1">10x15 cm (1 ảnh)</option>
          <option value="2">6x9 cm (2 ảnh)</option>
          <option value="4" selected>4x6 cm (4 ảnh)</option>
          <option value="8">3x4 cm (8 ảnh thẻ)</option>
        </select>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="repeatPhoto" checked onchange="app.renderLayout()">
          <label class="form-check-label small text-muted" for="repeatPhoto">Lặp lại ảnh nếu thiếu cho kín trang</label>
        </div>
      </div>

      <div class="control-card">
        <h5 class="card-title"><i class="bi bi-type"></i> Thương hiệu & Watermark</h5>
        <div class="mb-2">
          <label class="small text-muted">Nội dung chữ</label>
          <input type="text" id="wmText" class="form-control form-control-sm" placeholder="VD: Happy Wedding..." onkeyup="app.renderLayout()">
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="small text-muted">Font chữ</label>
            <select id="wmFont" class="form-select form-select-sm" onchange="app.renderLayout()">
              <option value="Arial">Arial</option>
              <option value="'Times New Roman'">Times New Roman</option>
              <option value="'Courier New'">Courier New</option>
              <option value="Impact">Impact</option>
              <option value="'Comic Sans MS'">Comic Sans</option>
            </select>
          </div>
          <div class="col-6">
            <label class="small text-muted">Căn lề</label>
            <select id="wmAlign" class="form-select form-select-sm" onchange="app.renderLayout()">
              <option value="center">Giữa (Center)</option>
              <option value="left">Trái (Left)</option>
              <option value="right">Phải (Right)</option>
            </select>
          </div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="small text-muted">Màu chữ</label>
            <input type="color" id="wmColor" class="form-control form-control-color w-100" value="#ffffff" onchange="app.renderLayout()">
          </div>
          <div class="col-6">
            <label class="small text-muted">Màu viền chữ</label>
            <input type="color" id="wmOutline" class="form-control form-control-color w-100" value="#000000" onchange="app.renderLayout()">
          </div>
        </div>
        <div>
          <label class="small text-muted">Logo (Góc trái trên)</label>
          <input type="file" id="wmLogo" class="form-control form-control-sm" accept="image/*" onchange="app.uploadLogo(event)">
        </div>
      </div>

      <div class="control-card">
        <h5 class="card-title"><i class="bi bi-sliders"></i> Chỉnh màu (Color Grading)</h5>
        <label class="small text-muted d-flex justify-content-between">Độ sáng <span id="valBr">100%</span></label>
        <input type="range" class="form-range" id="brSetting" min="50" max="150" value="100" oninput="app.updateFilters()">
        
        <label class="small text-muted d-flex justify-content-between mt-2">Tương phản <span id="valCt">100%</span></label>
        <input type="range" class="form-range" id="ctSetting" min="50" max="150" value="100" oninput="app.updateFilters()">
        
        <label class="small text-muted d-flex justify-content-between mt-2">Độ bão hòa <span id="valSt">100%</span></label>
        <input type="range" class="form-range" id="stSetting" min="0" max="200" value="100" oninput="app.updateFilters()">
        
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-sm btn-outline-warning w-50" onclick="app.autoColor()">Auto Cân bằng</button>
          <button class="btn btn-sm btn-outline-secondary w-50" onclick="app.resetFilters()">Reset Màu</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Canvas để xử lý hình ảnh in -->
  <canvas id="finalCanvas" width="1200" height="1800"></canvas>

  <script>
    // ==============================================================
    // URL API GOOGLE APPS SCRIPT CỦA BẠN (DÁN LINK /exec VÀO ĐÂY)
    // ==============================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycby6_-gotKSFnMsAsvC_TXmqCEeibp339208kcTpuKF8c9DsSMH1WQ05U00MwlztEqRfYg/exec'; 

    const app = {
      video: document.getElementById('videoElement'),
      canvas: document.getElementById('finalCanvas'),
      ctx: document.getElementById('finalCanvas').getContext('2d'),
      stream: null,
      
      photos: [],
      watermarkLogo: null,
      isCameraRotated: false,

      // Background Upload Queue Variables
      totalToUpload: 0,
      totalUploaded: 0,

      init: async function() {
        await this.loadDeviceList();
        this.startCamera();
      },

      /* --- CAMERA --- */
      loadDeviceList: async function() {
        try {
          await navigator.mediaDevices.getUserMedia({ video: true });
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(d => d.kind === 'videoinput');
          const select = document.getElementById('cameraSelect');
          select.innerHTML = '';
          videoDevices.forEach((device, index) => {
            select.appendChild(new Option(device.label || `Camera ${index + 1}`, device.deviceId));
          });
        } catch (err) {
          console.error("Lỗi lấy danh sách camera", err);
        }
      },

      startCamera: async function(deviceId = null) {
        if (this.stream) this.stream.getTracks().forEach(track => track.stop());
        const constraints = { video: deviceId ? { deviceId: { exact: deviceId }, width: {ideal: 1920}, height: {ideal: 1080} } : { facingMode: "user", width: {ideal: 1920}, height: {ideal: 1080} } };
        try {
          this.stream = await navigator.mediaDevices.getUserMedia(constraints);
          this.video.srcObject = this.stream;
        } catch (err) {
          Swal.fire('Lỗi', 'Không thể truy cập camera.', 'error');
        }
      },

      switchCamera: function() { this.startCamera(document.getElementById('cameraSelect').value); },

      toggleCameraRotation: function() {
        this.isCameraRotated = !this.isCameraRotated;
        this.video.style.transform = this.isCameraRotated ? 'rotate(90deg)' : 'rotate(0deg)';
      },

      /* --- CHUỖI CHỤP LIÊN TỤC & FULLSCREEN --- */
      startCaptureSession: async function() {
        const count = parseInt(document.getElementById('photoCount').value);
        const timer = parseInt(document.getElementById('timerCount').value);
        const viewport = document.getElementById('viewport');
        const overlay = document.getElementById('countdownOverlay');

        // Yêu cầu Fullscreen trình duyệt cho vùng Camera
        if(viewport.requestFullscreen) {
          await viewport.requestFullscreen().catch(err => console.log(err));
        }

        for (let i = 0; i < count; i++) {
          // 1. Đếm ngược
          overlay.style.display = 'flex';
          for (let t = timer; t > 0; t--) {
            overlay.innerText = t;
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          
          // 2. Chụp và nháy Flash
          overlay.style.display = 'none';
          viewport.style.backgroundColor = '#fff';
          this.video.style.opacity = 0;
          setTimeout(() => { viewport.style.backgroundColor = '#000'; this.video.style.opacity = 1; }, 100);
          
          this.captureSingleFrame();
          
          // 3. Tạm nghỉ 1s để chuẩn bị dáng cho ảnh tiếp theo
          if(i < count - 1) {
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
        }

        // Thoát Fullscreen khi chụp xong
        if(document.fullscreenElement) {
          document.exitFullscreen().catch(err => {});
        }
        
        // Vẽ lại bố cục in sau khi có ảnh mới
        this.renderLayout();
      },

      captureSingleFrame: function() {
        const tempCanvas = document.createElement('canvas');
        const tCtx = tempCanvas.getContext('2d');
        
        // Can thiệp vào ngữ cảnh vẽ nếu camera bị xoay ngang 90 độ
        if (this.isCameraRotated) {
          tempCanvas.width = this.video.videoHeight;
          tempCanvas.height = this.video.videoWidth;
          tCtx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
          tCtx.rotate(Math.PI / 2);
          tCtx.drawImage(this.video, -this.video.videoWidth / 2, -this.video.videoHeight / 2);
        } else {
          tempCanvas.width = this.video.videoWidth;
          tempCanvas.height = this.video.videoHeight;
          tCtx.drawImage(this.video, 0, 0);
        }

        const base64Img = tempCanvas.toDataURL('image/jpeg', 0.9);
        
        // 1. Thêm vào mảng hiển thị
        const imgObj = new Image();
        imgObj.onload = () => {
          this.photos.push(imgObj);
          this.updateGalleryUI();
        };
        imgObj.src = base64Img;

        // 2. Đẩy tiến trình tải ngầm lên Drive
        this.uploadImageInBackground(base64Img);
      },

      /* --- UPLOAD NGẦM LÊN GOOGLE DRIVE --- */
      uploadImageInBackground: function(base64Data) {
        if (!API_URL || API_URL.includes('AKfycbx...')) return; // Bỏ qua nếu chưa cấu hình link thật

        this.totalToUpload++;
        this.updateUploadUI();

        const fileName = 'Raw_' + new Date().getTime() + '.jpg';
        const formData = new URLSearchParams();
        formData.append('image', base64Data);
        formData.append('fileName', fileName);

        fetch(API_URL, { method: 'POST', body: formData })
          .then(res => res.json())
          .then(res => {
            if(res.success) this.totalUploaded++;
            this.updateUploadUI();
          })
          .catch(err => {
            console.error("Upload Lỗi:", err);
            this.updateUploadUI(); // Vẫn cập nhật UI để không kẹt thanh progress
          });
      },

      updateUploadUI: function() {
        document.getElementById('uploadCount').innerText = `${this.totalUploaded}/${this.totalToUpload}`;
        let percent = 0;
        if(this.totalToUpload > 0) {
          percent = Math.round((this.totalUploaded / this.totalToUpload) * 100);
        }
        document.getElementById('uploadProgress').style.width = percent + '%';
        document.getElementById('uploadStatusText').innerText = percent === 100 ? "Đã xong" : "Đang xử lý...";
        
        // Reset nếu hoàn thành
        if(this.totalUploaded === this.totalToUpload && this.totalToUpload > 0) {
          setTimeout(() => {
            this.totalUploaded = 0;
            this.totalToUpload = 0;
            document.getElementById('uploadProgress').style.width = '0%';
            document.getElementById('uploadCount').innerText = '0/0';
            document.getElementById('uploadStatusText').innerText = 'Sẵn sàng';
          }, 3000);
        }
      },

      /* --- QUẢN LÝ ẢNH & BỐ CỤC --- */
      updateGalleryUI: function() {
        const container = document.getElementById('galleryContainer');
        container.innerHTML = '';
        this.photos.forEach((img, index) => {
          const thumb = document.createElement('img');
          thumb.src = img.src;
          thumb.className = 'thumb-item';
          thumb.title = `Click để xóa ảnh ${index + 1}`;
          thumb.onclick = () => {
            this.photos.splice(index, 1);
            this.updateGalleryUI();
            this.renderLayout();
          };
          container.appendChild(thumb);
        });
      },

      renderLayout: function() {
        const cw = this.canvas.width;
        const ch = this.canvas.height;
        
        // Nền trắng
        this.ctx.clearRect(0, 0, cw, ch);
        this.ctx.fillStyle = "#ffffff";
        this.ctx.fillRect(0, 0, cw, ch);

        if(this.photos.length === 0) return;

        // Bộ lọc màu
        const br = document.getElementById('brSetting').value;
        const ct = document.getElementById('ctSetting').value;
        const st = document.getElementById('stSetting').value;
        this.ctx.filter = `brightness(${br}%) contrast(${ct}%) saturate(${st}%)`;

        // Tính toán lưới
        const layout = parseInt(document.getElementById('layoutSelect').value);
        let cols = 1, rows = 1;
        if(layout === 2) { cols = 1; rows = 2; }
        else if(layout === 4) { cols = 2; rows = 2; }
        else if(layout === 8) { cols = 2; rows = 4; }

        const cellW = cw / cols;
        const cellH = ch / rows;
        const allowRepeat = document.getElementById('repeatPhoto').checked;
        const text = document.getElementById('wmText').value;
        const borderThick = 20;

        let photoIndex = 0;

        for(let r = 0; r < rows; r++) {
          for(let c = 0; c < cols; c++) {
            let imgToDraw = null;
            if (photoIndex < this.photos.length) {
              imgToDraw = this.photos[photoIndex];
              photoIndex++;
            } else if (allowRepeat && this.photos.length > 0) {
              photoIndex = 0; 
              imgToDraw = this.photos[photoIndex];
              photoIndex++;
            }

            if (imgToDraw) {
              const x = c * cellW;
              const y = r * cellH;
              
              // Cắt và vẽ hình ảnh
              this.drawImageCover(imgToDraw, x, y, cellW, cellH);
              
              // Reset filter cho Chữ/Logo
              const currentFilter = this.ctx.filter;
              this.ctx.filter = "none";

              // Vẽ Logo
              if (this.watermarkLogo) {
                const logoW = cellW * 0.2; 
                const logoH = (this.watermarkLogo.height / this.watermarkLogo.width) * logoW;
                this.ctx.drawImage(this.watermarkLogo, x + borderThick, y + borderThick, logoW, logoH);
              }

              // Vẽ Watermark trực tiếp (Không khung nền trắng)
              if (text) {
                const fontSize = cellH * 0.05;
                this.ctx.font = `bold ${fontSize}px ${document.getElementById('wmFont').value}`;
                this.ctx.fillStyle = document.getElementById('wmColor').value;
                this.ctx.strokeStyle = document.getElementById('wmOutline').value;
                this.ctx.lineWidth = 4; // Độ dày viền chữ
                this.ctx.textBaseline = "bottom";
                
                const align = document.getElementById('wmAlign').value;
                this.ctx.textAlign = align;
                
                let textX = x;
                // Padding cho căn lề
                const paddingX = 30;
                const textY = y + cellH - 30; // Chân chữ cách đáy 30px

                if(align === "center") textX = x + (cellW / 2);
                else if(align === "left") textX = x + paddingX;
                else if(align === "right") textX = x + cellW - paddingX;
                
                // Vẽ viền ngoài, sau đó vẽ chữ đè lên (Hiệu ứng Stroke Text)
                this.ctx.strokeText(text, textX, textY);
                this.ctx.fillText(text, textX, textY);
              }

              // Vẽ viền cắt ảnh (Nét đứt)
              this.ctx.strokeStyle = "#cccccc";
              this.ctx.lineWidth = 2;
              this.ctx.setLineDash([10, 10]); 
              this.ctx.strokeRect(x, y, cellW, cellH);
              this.ctx.setLineDash([]); // Reset nét đứt

              this.ctx.filter = currentFilter;
            }
          }
        }
        this.ctx.filter = "none";
      },

      drawImageCover: function(img, x, y, w, h) {
        const imgRatio = img.width / img.height;
        const canvasRatio = w / h;
        let drawW = img.width, drawH = img.height, offsetX = 0, offsetY = 0;
        if (imgRatio > canvasRatio) {
          drawW = img.height * canvasRatio;
          offsetX = (img.width - drawW) / 2;
        } else {
          drawH = img.width / canvasRatio;
          offsetY = (img.height - drawH) / 2;
        }
        this.ctx.drawImage(img, offsetX, offsetY, drawW, drawH, x, y, w, h);
      },

      print: function() {
        if(this.photos.length === 0) return Swal.fire('Cảnh báo', 'Vui lòng chụp ít nhất 1 ảnh trước khi in.', 'warning');
        this.renderLayout(); // Cập nhật bản vẽ cuối cùng
        window.print();
      },

      /* --- CÁC HÀM TIỆN ÍCH --- */
      updateFilters: function() {
        document.getElementById('valBr').innerText = document.getElementById('brSetting').value + '%';
        document.getElementById('valCt').innerText = document.getElementById('ctSetting').value + '%';
        document.getElementById('valSt').innerText = document.getElementById('stSetting').value + '%';
        this.renderLayout();
      },
      autoColor: function() {
        document.getElementById('brSetting').value = 110;
        document.getElementById('ctSetting').value = 115;
        document.getElementById('stSetting').value = 110;
        this.updateFilters();
      },
      resetFilters: function() {
        document.getElementById('brSetting').value = 100;
        document.getElementById('ctSetting').value = 100;
        document.getElementById('stSetting').value = 100;
        this.updateFilters();
      },
      uploadLogo: function(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => { this.watermarkLogo = img; this.renderLayout(); }
          img.src = e.target.result;
        }
        reader.readAsDataURL(file);
      }
    };

    // Khởi động
    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
