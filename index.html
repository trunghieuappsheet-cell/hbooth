<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro PhotoBooth - Studio Kéo Thả & Chỉnh Sửa Khung</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body { background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; margin: 0; }
    
    .app-container { display: flex; height: 100vh; }
    
    /* Cột Trái (Camera & Ảnh) */
    .left-panel { flex: 5; display: flex; flex-direction: column; padding: 15px; border-right: 1px solid #333; background: #1a1a1a; overflow-y: auto; }
    
    /* Cột Phải (Canvas In) */
    .right-panel { flex: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; background: #222; position: relative; }
    
    /* Khu vực Camera */
    .viewport-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 2px solid #333; display: flex; align-items: center; justify-content: center; transition: aspect-ratio 0.3s; }
    .viewport-wrapper.vertical { aspect-ratio: 9/16; max-height: 40vh; }
    #videoElement { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    
    /* Nút đổi hướng Camera */
    .camera-modes { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 10; }
    .btn-cam-mode { background: rgba(0,0,0,0.6); color: white; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; cursor: pointer; backdrop-filter: blur(4px); }
    .btn-cam-mode.active { background: #0d6efd; border-color: #0d6efd; }
    #countdownOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; font-size: 100px; font-weight: bold; color: white; z-index: 50; }

    /* Thư viện ảnh */
    .gallery-section { margin-top: 15px; background: #1e1e1e; padding: 10px; border-radius: 8px; border: 1px solid #333; }
    .gallery-title { font-size: 0.9rem; font-weight: bold; color: #aaa; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .gallery-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; min-height: 100px; align-items: center; }
    
    .thumb-item { width: 70px; height: 100px; object-fit: cover; border: 2px solid #555; border-radius: 4px; cursor: grab; transition: transform 0.2s; }
    .thumb-item:active { cursor: grabbing; transform: scale(0.95); }
    .thumb-item:hover { border-color: #0d6efd; }

    /* Canvas hiển thị In */
    .canvas-wrapper { height: 85vh; max-width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #444; border-radius: 4px; overflow: hidden; background: #fff; display: flex; align-items: center; justify-content: center; }
    #finalCanvas { max-height: 100%; max-width: 100%; object-fit: contain; cursor: pointer; transition: 0.3s; }
    #finalCanvas:hover { box-shadow: 0 0 15px rgba(13, 110, 253, 0.5); }

    .btn-settings { position: absolute; top: 15px; right: 15px; z-index: 100; border-radius: 50px; padding: 8px 16px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

    /* Upload status */
    .upload-status { font-size: 0.8rem; display: flex; align-items: center; margin-top: 10px; color: #aaa; }
    .progress { height: 6px; background-color: #333; flex-grow: 1; margin: 0 10px; border-radius: 3px; }
    .progress-bar { background-color: #198754; transition: width 0.3s; }

    /* Định dạng CSS cho lệnh In động */
    @media print {
      body * { visibility: hidden; }
      #finalCanvas { visibility: visible; position: fixed; left: 0; top: 0; max-width: none; max-height: none; width: 100vw; height: 100vh; object-fit: cover; z-index: 9999; }
    }
  </style>
</head>
<body>

  <!-- Khối style dùng để ép khổ giấy khi in (sẽ được JS cập nhật ngang/dọc) -->
  <style id="printStyle"></style>

  <div class="app-container">
    
    <!-- CỘT TRÁI: CAMERA VÀ THƯ VIỆN -->
    <div class="left-panel">
      
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="m-0 fw-bold"><i class="bi bi-camera-fill text-primary"></i> Live Camera</h5>
        <!-- THIẾT LẬP CHỌN CAMERA -->
        <select id="cameraSelect" class="form-select form-select-sm w-50 bg-dark text-white border-secondary" onchange="app.switchCamera()">
          <option>Đang tải Camera...</option>
        </select>
      </div>

      <!-- Màn hình Live Camera -->
      <div class="viewport-wrapper" id="viewport">
        <div class="camera-modes">
          <button class="btn-cam-mode active" id="btnModeH" onclick="app.setCameraMode('horizontal')" title="Ngang"><i class="bi bi-phone-landscape"></i></button>
          <button class="btn-cam-mode" id="btnModeV" onclick="app.setCameraMode('vertical')" title="Dọc"><i class="bi bi-phone"></i></button>
        </div>
        <video id="videoElement" autoplay playsinline></video>
        <div id="countdownOverlay">3</div>
      </div>

      <div class="d-flex justify-content-center mt-3 gap-2">
        <button class="btn btn-primary fw-bold px-4 rounded-pill shadow" onclick="app.startCaptureSession()"><i class="bi bi-circle-fill text-danger me-2"></i> Chụp Ngay</button>
      </div>

      <!-- Khu vực Ảnh đã chụp -->
      <div class="gallery-section mt-3">
        <div class="gallery-title">
          <span><i class="bi bi-images text-info"></i> Ảnh đã chụp (Kéo sang phải)</span>
        </div>
        <div class="gallery-container" id="capturedGallery">
          <span class="text-muted small w-100 text-center">Chưa có ảnh chụp</span>
        </div>
        <div class="upload-status" id="uploadStatusUI" style="display: none;">
          Đang tải lên: <span id="uploadCount" class="ms-1">0/0</span>
          <div class="progress"><div class="progress-bar" id="uploadProgress" style="width: 0%"></div></div>
        </div>
      </div>

      <!-- Khu vực Ảnh tải lên -->
      <div class="gallery-section">
        <div class="gallery-title">
          <span><i class="bi bi-folder2-open text-warning"></i> Ảnh từ thiết bị</span>
          <label class="btn btn-sm btn-outline-secondary m-0 px-2 py-0" style="cursor: pointer;">
            Thêm ảnh <input type="file" id="fileInput" accept="image/*" multiple onchange="app.uploadLocalPhotos(event)" hidden>
          </label>
        </div>
        <div class="gallery-container" id="uploadedGallery">
           <span class="text-muted small w-100 text-center">Trống</span>
        </div>
      </div>
    </div>

    <!-- CỘT PHẢI: TRANG IN & KÉO THẢ -->
    <div class="right-panel">
      <!-- Nút mở Menu Cài đặt -->
      <button class="btn btn-dark btn-settings" data-bs-toggle="offcanvas" data-bs-target="#settingsOffcanvas">
        <i class="bi bi-sliders"></i> Cài đặt
      </button>

      <div class="d-flex justify-content-between w-100 px-3 mb-2 align-items-center">
        <div>
          <h5 class="fw-bold m-0"><i class="bi bi-layout-text-window text-info"></i> Bố cục Trang in</h5>
          <small class="text-muted" id="orientationBadge">Đang để: Ngang (Landscape)</small>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-danger" onclick="app.clearLayout()">Xóa Bố Cục</button>
          <button class="btn btn-sm btn-success fw-bold px-4 shadow" onclick="app.print()"><i class="bi bi-printer"></i> IN ẢNH</button>
        </div>
      </div>

      <!-- Vùng Canvas hứng ảnh thả vào. (Click để sửa ảnh) -->
      <div class="canvas-wrapper">
        <canvas id="finalCanvas" 
                ondragover="app.allowDrop(event)" 
                ondrop="app.handleDrop(event)"
                title="Bấm vào một khung ảnh bất kỳ để chỉnh sửa (Xén, Xoay, Chỉnh màu)"></canvas>
      </div>
    </div>
  </div>

  <!-- OFFCANVAS (MENU CÀI ĐẶT BÊN PHẢI) -->
  <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="settingsOffcanvas" style="width: 380px;">
    <div class="offcanvas-header border-bottom border-secondary">
      <h5 class="offcanvas-title fw-bold"><i class="bi bi-gear-fill text-primary"></i> Cài đặt Hệ thống</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      
      <div class="mb-4">
        <h6 class="fw-bold text-info border-bottom border-secondary pb-1">1. Bộ đếm & Khổ giấy in</h6>
        <label class="form-label small">Chọn Bố cục (Tự xoay khổ in)</label>
        <select id="layoutSelect" class="form-select form-select-sm mb-3" onchange="app.changeLayout()">
          <option value="1">10x15 cm (1 ảnh) - Ngang</option>
          <option value="2">6x9 cm (2 ô) - Dọc</option>
          <option value="4" selected>4x6 cm (4 ô) - Ngang</option>
          <option value="8">3x4 cm (8 ô) - Ngang</option>
        </select>
        
        <div class="row g-2">
          <div class="col-6">
             <label class="small text-muted">Số lượng chụp</label>
             <input type="number" id="photoCount" class="form-control form-control-sm" value="1" min="1" max="10">
          </div>
          <div class="col-6">
             <label class="small text-muted">Đếm ngược (s)</label>
             <input type="number" id="timerCount" class="form-control form-control-sm" value="3" min="0" max="10">
          </div>
        </div>
      </div>

      <div class="mb-4">
        <h6 class="fw-bold text-info border-bottom border-secondary pb-1">2. Thương hiệu & Watermark</h6>
        <input type="text" id="wmText" class="form-control form-control-sm mb-2" placeholder="Nội dung chữ..." onkeyup="app.renderCanvas()">
        <div class="row g-2 mb-2">
          <div class="col-6">
            <select id="wmFont" class="form-select form-select-sm" onchange="app.renderCanvas()">
              <option value="Arial">Arial</option>
              <option value="Times New Roman">Times New Roman</option>
              <option value="Impact">Impact</option>
            </select>
          </div>
          <div class="col-6">
            <select id="wmAlign" class="form-select form-select-sm" onchange="app.renderCanvas()">
              <option value="center">Căn Giữa</option>
              <option value="left">Căn Trái</option>
              <option value="right">Căn Phải</option>
            </select>
          </div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6 d-flex align-items-center gap-2">
            <input type="color" id="wmColor" class="form-control form-control-color p-1" value="#ffffff" onchange="app.renderCanvas()" style="width:30px; height:30px;">
            <span class="small">Màu chữ</span>
          </div>
          <div class="col-6 d-flex align-items-center gap-2">
            <input type="color" id="wmOutline" class="form-control form-control-color p-1" value="#000000" onchange="app.renderCanvas()" style="width:30px; height:30px;">
            <span class="small">Viền chữ</span>
          </div>
        </div>
        <label class="small text-muted">Logo góc trái (PNG trong suốt)</label>
        <input type="file" class="form-control form-control-sm" accept="image/*" onchange="app.loadLogo(event)">
      </div>
      
      <div class="mb-4">
        <h6 class="fw-bold text-info border-bottom border-secondary pb-1">3. Mẫu thiết đặt</h6>
        <button class="btn btn-sm btn-primary w-100 mb-2" onclick="app.saveTemplate()">Lưu Cài đặt làm Mẫu</button>
        <button class="btn btn-sm btn-outline-light w-100" onclick="app.loadTemplate()">Tải Mẫu đã lưu</button>
      </div>

    </div>
  </div>

  <!-- MODAL CHỈNH SỬA TỪNG KHUNG ẢNH KHI BẤM VÀO CANVAS -->
  <div class="modal fade" id="editModal" tabindex="-1" data-bs-theme="dark">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold"><i class="bi bi-crop"></i> Chỉnh sửa Khung ảnh</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12 text-center mb-2">
              <button class="btn btn-sm btn-outline-info w-100" onclick="app.rotateActiveSlot()"><i class="bi bi-arrow-clockwise"></i> Xoay ảnh 90 độ</button>
            </div>
            
            <div class="col-12">
              <label class="small w-100 text-muted">Phóng to (Crop) <span id="lblZoom" class="float-end">1.0x</span></label>
              <input type="range" class="form-range" id="m_zoom" min="0.5" max="3" step="0.1" oninput="app.applySlotEdit()">
            </div>
            
            <div class="col-6">
              <label class="small w-100 text-muted">Di chuyển X (Ngang)</label>
              <input type="range" class="form-range" id="m_panX" min="-100" max="100" step="1" oninput="app.applySlotEdit()">
            </div>
            <div class="col-6">
              <label class="small w-100 text-muted">Di chuyển Y (Dọc)</label>
              <input type="range" class="form-range" id="m_panY" min="-100" max="100" step="1" oninput="app.applySlotEdit()">
            </div>

            <div class="col-12 mt-3 border-top border-secondary pt-3">
              <label class="small w-100 text-muted">Độ sáng <span id="lblBr" class="float-end">100%</span></label>
              <input type="range" class="form-range" id="m_br" min="50" max="150" step="1" oninput="app.applySlotEdit()">
            </div>
            <div class="col-12">
              <label class="small w-100 text-muted">Độ tương phản <span id="lblCt" class="float-end">100%</span></label>
              <input type="range" class="form-range" id="m_ct" min="50" max="150" step="1" oninput="app.applySlotEdit()">
            </div>
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-outline-danger me-auto" onclick="app.removeActiveSlot()">Xóa Khỏi Ô</button>
          <button type="button" class="btn btn-secondary" onclick="app.resetActiveSlot()">Khôi Phục</button>
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Hoàn tất</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Link Google App Script (API)
    const API_URL = 'https://script.google.com/macros/s/AKfycby6_-gotKSFnMsAsvC_TXmqCEeibp339208kcTpuKF8c9DsSMH1WQ05U00MwlztEqRfYg/exec'; 

    const app = {
      video: document.getElementById('videoElement'),
      canvas: document.getElementById('finalCanvas'),
      ctx: document.getElementById('finalCanvas').getContext('2d'),
      stream: null,
      editModalInstance: null,
      
      capturedPhotos: [],
      uploadedPhotos: [],
      
      // Mảng Slots chứa Object cấu hình cho từng ô (Thay vì chỉ chứa Image)
      layoutSlots: [], 
      
      watermarkLogo: null,
      cameraMode: 'horizontal', 
      isLandscape: true, // Quyết định khổ giấy in
      dragPayload: null,
      activeSlotIndex: -1, // Slot đang được mở trong Modal chỉnh sửa

      totalToUpload: 0,
      totalUploaded: 0,

      init: async function() {
        this.editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));
        await this.loadDeviceList();
        this.startCamera();
        this.changeLayout(); // Khởi tạo layout mặc định (4 ô - ngang)
        
        // Sự kiện Click vào Canvas để sửa ảnh
        this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
      },

      /* --- 1. CAMERA & CHỤP --- */
      loadDeviceList: async function() {
        try {
          await navigator.mediaDevices.getUserMedia({ video: true });
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(d => d.kind === 'videoinput');
          const select = document.getElementById('cameraSelect');
          select.innerHTML = '';
          videoDevices.forEach((device, index) => {
            select.appendChild(new Option(device.label || `Camera ${index + 1}`, device.deviceId));
          });
        } catch (err) {
          console.error("Camera List Error:", err);
        }
      },

      startCamera: async function() {
        const deviceId = document.getElementById('cameraSelect').value;
        if (this.stream) this.stream.getTracks().forEach(track => track.stop());
        const constraints = { video: deviceId ? { deviceId: { exact: deviceId }, width: {ideal: 1920}, height: {ideal: 1080} } : { facingMode: "user", width: {ideal: 1920}, height: {ideal: 1080} } };
        try {
          this.stream = await navigator.mediaDevices.getUserMedia(constraints);
          this.video.srcObject = this.stream;
        } catch (err) {
          Swal.fire('Lỗi', 'Không thể truy cập camera.', 'error');
        }
      },

      switchCamera: function() { this.startCamera(); },

      setCameraMode: function(mode) {
        this.cameraMode = mode;
        const wp = document.getElementById('viewport');
        document.getElementById('btnModeH').classList.remove('active');
        document.getElementById('btnModeV').classList.remove('active');
        
        if(mode === 'horizontal') {
          wp.classList.remove('vertical');
          this.video.style.transform = 'rotate(0deg)';
          document.getElementById('btnModeH').classList.add('active');
        } else {
          wp.classList.add('vertical');
          this.video.style.transform = 'rotate(90deg)';
          document.getElementById('btnModeV').classList.add('active');
        }
      },

      startCaptureSession: async function() {
        const count = parseInt(document.getElementById('photoCount').value);
        const timer = parseInt(document.getElementById('timerCount').value);
        const viewport = document.getElementById('viewport');
        const overlay = document.getElementById('countdownOverlay');

        for (let i = 0; i < count; i++) {
          overlay.style.display = 'flex';
          for (let t = timer; t > 0; t--) {
            overlay.innerText = t;
            await new Promise(r => setTimeout(r, 1000));
          }
          
          overlay.style.display = 'none';
          viewport.style.backgroundColor = '#fff';
          this.video.style.opacity = 0;
          setTimeout(() => { viewport.style.backgroundColor = '#000'; this.video.style.opacity = 1; }, 100);
          
          this.captureSingleFrame();
          if(i < count - 1) await new Promise(r => setTimeout(r, 1000));
        }
      },

      captureSingleFrame: function() {
        const tempCanvas = document.createElement('canvas');
        const tCtx = tempCanvas.getContext('2d');
        
        if (this.cameraMode === 'vertical') {
          tempCanvas.width = this.video.videoHeight;
          tempCanvas.height = this.video.videoWidth;
          tCtx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
          tCtx.rotate(Math.PI / 2);
          tCtx.drawImage(this.video, -this.video.videoWidth / 2, -this.video.videoHeight / 2);
        } else {
          tempCanvas.width = this.video.videoWidth;
          tempCanvas.height = this.video.videoHeight;
          tCtx.drawImage(this.video, 0, 0);
        }

        const base64Img = tempCanvas.toDataURL('image/jpeg', 0.9);
        const imgObj = new Image();
        imgObj.onload = () => {
          this.capturedPhotos.push(imgObj);
          this.renderGalleries();
          this.autoFillFirstEmptySlot(imgObj);
        };
        imgObj.src = base64Img;
        this.uploadToDrive(base64Img);
      },

      uploadLocalPhotos: function(e) {
        const files = e.target.files;
        for(let file of files) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            const img = new Image();
            img.onload = () => { this.uploadedPhotos.push(img); this.renderGalleries(); };
            img.src = evt.target.result;
          };
          reader.readAsDataURL(file);
        }
      },

      uploadToDrive: function(base64) {
        if(!API_URL || API_URL.includes('AKfycbx...')) return;
        this.totalToUpload++;
        document.getElementById('uploadStatusUI').style.display = 'flex';
        this.updateUploadUI();

        const fd = new URLSearchParams();
        fd.append('image', base64);
        fd.append('fileName', 'Live_' + new Date().getTime() + '.jpg');

        fetch(API_URL, { method: 'POST', body: fd })
          .then(r => r.json())
          .then(r => { if(r.success) this.totalUploaded++; this.updateUploadUI(); })
          .catch(() => this.updateUploadUI());
      },

      updateUploadUI: function() {
        document.getElementById('uploadCount').innerText = `${this.totalUploaded}/${this.totalToUpload}`;
        let percent = this.totalToUpload > 0 ? Math.round((this.totalUploaded / this.totalToUpload) * 100) : 0;
        document.getElementById('uploadProgress').style.width = percent + '%';
        if(this.totalUploaded === this.totalToUpload && this.totalToUpload > 0) {
          setTimeout(() => { document.getElementById('uploadStatusUI').style.display = 'none'; }, 2000);
        }
      },

      /* --- 2. GIAO DIỆN & KÉO THẢ --- */
      renderGalleries: function() {
        const capContainer = document.getElementById('capturedGallery');
        capContainer.innerHTML = '';
        this.capturedPhotos.forEach((img, i) => capContainer.appendChild(this.createThumb(img, i)));
        if(this.capturedPhotos.length === 0) capContainer.innerHTML = '<span class="text-muted small">Trống</span>';

        const upContainer = document.getElementById('uploadedGallery');
        upContainer.innerHTML = '';
        this.uploadedPhotos.forEach((img, i) => upContainer.appendChild(this.createThumb(img, i)));
        if(this.uploadedPhotos.length === 0) upContainer.innerHTML = '<span class="text-muted small">Trống</span>';
      },

      createThumb: function(imgObj) {
        const img = document.createElement('img');
        img.src = imgObj.src;
        img.className = 'thumb-item';
        img.draggable = true;
        
        img.ondragstart = (e) => { this.dragPayload = imgObj; };
        img.onclick = () => { Swal.fire({ imageUrl: imgObj.src, showConfirmButton: false, background: 'transparent' }); };
        return img;
      },

      allowDrop: function(e) { e.preventDefault(); },

      handleDrop: function(e) {
        e.preventDefault();
        if(!this.dragPayload) return;

        const rect = this.canvas.getBoundingClientRect();
        const scaleX = this.canvas.width / rect.width;
        const scaleY = this.canvas.height / rect.height;

        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        const layoutConfig = this.getLayoutConfig();
        const cellW = this.canvas.width / layoutConfig.cols;
        const cellH = this.canvas.height / layoutConfig.rows;

        const colIndex = Math.floor(x / cellW);
        const rowIndex = Math.floor(y / cellH);
        const targetIndex = (rowIndex * layoutConfig.cols) + colIndex;

        this.setSlotObject(targetIndex, this.dragPayload);
        this.renderCanvas();
        this.dragPayload = null; 
      },

      autoFillFirstEmptySlot: function(imgObj) {
        const maxSlots = parseInt(document.getElementById('layoutSelect').value);
        for(let i = 0; i < maxSlots; i++) {
          if(!this.layoutSlots[i]) {
            this.setSlotObject(i, imgObj);
            this.renderCanvas();
            break;
          }
        }
      },

      setSlotObject: function(index, imgObj) {
        // Cấu hình mặc định khi ảnh được thả vào
        this.layoutSlots[index] = {
          img: imgObj,
          zoom: 1,
          panX: 0,
          panY: 0,
          rotate: 0,
          br: 100,
          ct: 100
        };
      },

      getLayoutConfig: function() {
        const val = parseInt(document.getElementById('layoutSelect').value);
        if(val === 2) return { cols: 1, rows: 2 };
        if(val === 4) return { cols: 2, rows: 2 };
        if(val === 8) return { cols: 4, rows: 2 }; // 1800x1200 chia 4 cột, 2 dòng -> 450x600 (tỷ lệ 3x4 thẻ)
        return { cols: 1, rows: 1 };
      },

      /* --- 3. QUẢN LÝ BỐ CỤC (XOAY TRANG) --- */
      changeLayout: function() {
        const val = parseInt(document.getElementById('layoutSelect').value);
        this.layoutSlots = new Array(val).fill(null);
        
        const badge = document.getElementById('orientationBadge');
        const printStyle = document.getElementById('printStyle');

        // Logic Xoay Trang Tự Động
        // Layout 2 (6x9) in trên khổ dọc 1200x1800. Các layout còn lại in ngang 1800x1200.
        if (val === 2) {
          this.canvas.width = 1200;
          this.canvas.height = 1800;
          this.isLandscape = false;
          badge.innerText = 'Trang in: Dọc (Portrait)';
          printStyle.innerHTML = `@media print { @page { size: 4in 6in; margin: 0; } }`;
        } else {
          this.canvas.width = 1800;
          this.canvas.height = 1200;
          this.isLandscape = true;
          badge.innerText = 'Trang in: Ngang (Landscape)';
          printStyle.innerHTML = `@media print { @page { size: 6in 4in; margin: 0; } }`;
        }
        
        this.renderCanvas();
      },
      
      clearLayout: function() { this.changeLayout(); },

      /* --- 4. TƯƠNG TÁC CHỈNH SỬA TỪNG KHUNG (MASKING) --- */
      handleCanvasClick: function(e) {
        const rect = this.canvas.getBoundingClientRect();
        const scaleX = this.canvas.width / rect.width;
        const scaleY = this.canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        const config = this.getLayoutConfig();
        const cellW = this.canvas.width / config.cols;
        const cellH = this.canvas.height / config.rows;

        const col = Math.floor(x / cellW);
        const row = Math.floor(y / cellH);
        const index = row * config.cols + col;

        if (this.layoutSlots[index]) {
          this.activeSlotIndex = index;
          this.openEditModal();
        }
      },

      openEditModal: function() {
        const slot = this.layoutSlots[this.activeSlotIndex];
        
        // Gắn giá trị hiện tại lên UI
        document.getElementById('m_zoom').value = slot.zoom;
        document.getElementById('m_panX').value = slot.panX;
        document.getElementById('m_panY').value = slot.panY;
        document.getElementById('m_br').value = slot.br;
        document.getElementById('m_ct').value = slot.ct;
        
        document.getElementById('lblZoom').innerText = slot.zoom + 'x';
        document.getElementById('lblBr').innerText = slot.br + '%';
        document.getElementById('lblCt').innerText = slot.ct + '%';

        this.editModalInstance.show();
      },

      applySlotEdit: function() {
        if(this.activeSlotIndex === -1) return;
        const slot = this.layoutSlots[this.activeSlotIndex];
        
        slot.zoom = parseFloat(document.getElementById('m_zoom').value);
        slot.panX = parseFloat(document.getElementById('m_panX').value);
        slot.panY = parseFloat(document.getElementById('m_panY').value);
        slot.br = parseInt(document.getElementById('m_br').value);
        slot.ct = parseInt(document.getElementById('m_ct').value);

        document.getElementById('lblZoom').innerText = slot.zoom + 'x';
        document.getElementById('lblBr').innerText = slot.br + '%';
        document.getElementById('lblCt').innerText = slot.ct + '%';

        this.renderCanvas(); // Cập nhật live preview
      },

      rotateActiveSlot: function() {
        if(this.activeSlotIndex === -1) return;
        const slot = this.layoutSlots[this.activeSlotIndex];
        slot.rotate = (slot.rotate + 90) % 360;
        this.renderCanvas();
      },

      resetActiveSlot: function() {
        if(this.activeSlotIndex === -1) return;
        const slot = this.layoutSlots[this.activeSlotIndex];
        slot.zoom = 1; slot.panX = 0; slot.panY = 0; slot.rotate = 0; slot.br = 100; slot.ct = 100;
        this.openEditModal(); // Cập nhật lại UI slider
        this.renderCanvas();
      },

      removeActiveSlot: function() {
        this.layoutSlots[this.activeSlotIndex] = null;
        this.renderCanvas();
        this.editModalInstance.hide();
      },

      /* --- 5. RENDER CANVAS VỚI CLIPPING MASK --- */
      renderCanvas: function() {
        const cw = this.canvas.width;
        const ch = this.canvas.height;
        
        this.ctx.clearRect(0, 0, cw, ch);
        this.ctx.fillStyle = "#ffffff";
        this.ctx.fillRect(0, 0, cw, ch);

        const config = this.getLayoutConfig();
        const cellW = cw / config.cols;
        const cellH = ch / config.rows;
        const text = document.getElementById('wmText').value;

        for(let r = 0; r < config.rows; r++) {
          for(let c = 0; c < config.cols; c++) {
            const index = r * config.cols + c;
            const slot = this.layoutSlots[index];
            const x = c * cellW;
            const y = r * cellH;

            if (slot) {
              // 1. Áp dụng Mask (Khung cắt) cho từng ô
              this.ctx.save();
              this.ctx.beginPath();
              this.ctx.rect(x, y, cellW, cellH);
              this.ctx.clip(); 

              // 2. Chỉnh màu cho riêng ảnh này
              this.ctx.filter = `brightness(${slot.br}%) contrast(${slot.ct}%)`;

              // 3. Tính toán kích thước ảnh (Object-fit: Cover)
              const imgRatio = slot.img.width / slot.img.height;
              
              // Nếu ảnh bị xoay ngang (90, 270), tỷ lệ canvas cần so sánh bị đảo ngược
              const isRotated = (slot.rotate === 90 || slot.rotate === 270);
              const targetRatio = isRotated ? (cellH / cellW) : (cellW / cellH);
              
              let drawW = cellW, drawH = cellH;
              if (imgRatio > targetRatio) {
                drawW = cellH * imgRatio;
              } else {
                drawH = cellW / imgRatio;
              }
              if(isRotated) {
                drawW = cellW * imgRatio;
                drawH = cellW; // Tương đối, thuật toán xoay sẽ chỉnh lại
                // Simplified cover math for rotated images
                if (imgRatio > (cellH/cellW)) {
                    drawH = cellW;
                    drawW = cellW * imgRatio;
                } else {
                    drawW = cellH;
                    drawH = cellH / imgRatio;
                }
              }

              // 4. Transform (Zoom, Move, Rotate)
              const centerX = x + cellW / 2;
              const centerY = y + cellH / 2;
              
              this.ctx.translate(centerX, centerY);
              this.ctx.translate(slot.panX * (cellW/100), slot.panY * (cellH/100)); // Pan (Dịch chuyển)
              this.ctx.scale(slot.zoom, slot.zoom); // Zoom
              this.ctx.rotate(slot.rotate * Math.PI / 180); // Rotate
              
              // Vẽ ảnh ở tâm
              this.ctx.drawImage(slot.img, -drawW / 2, -drawH / 2, drawW, drawH);
              this.ctx.restore(); // Gỡ Mask và Filter

            } else {
              // Ô trống
              this.ctx.fillStyle = "#f8f9fa";
              this.ctx.fillRect(x, y, cellW, cellH);
              this.ctx.fillStyle = "#bbb";
              this.ctx.font = "24px Arial";
              this.ctx.textAlign = "center";
              this.ctx.textBaseline = "middle";
              this.ctx.fillText("Kéo ảnh thả vào", x + cellW/2, y + cellH/2);
            }
            
            // Vẽ Logo
            if (this.watermarkLogo) {
              const logoW = cellW * 0.2; 
              const logoH = (this.watermarkLogo.height / this.watermarkLogo.width) * logoW;
              this.ctx.drawImage(this.watermarkLogo, x + 20, y + 20, logoW, logoH);
            }

            // Vẽ Watermark chữ
            if (text) {
              const fontSize = cellH * 0.05;
              this.ctx.font = `bold ${fontSize}px ${document.getElementById('wmFont').value}`;
              this.ctx.fillStyle = document.getElementById('wmColor').value;
              this.ctx.strokeStyle = document.getElementById('wmOutline').value;
              this.ctx.lineWidth = 4;
              this.ctx.textBaseline = "bottom";
              
              const align = document.getElementById('wmAlign').value;
              this.ctx.textAlign = align;
              
              let textX = x;
              const textY = y + cellH - 30;
              if(align === "center") textX = x + (cellW / 2);
              else if(align === "left") textX = x + 30;
              else if(align === "right") textX = x + cellW - 30;
              
              this.ctx.strokeText(text, textX, textY);
              this.ctx.fillText(text, textX, textY);
            }

            // Vẽ viền nét đứt
            this.ctx.strokeStyle = "#dddddd";
            this.ctx.lineWidth = 2;
            this.ctx.setLineDash([10, 10]); 
            this.ctx.strokeRect(x, y, cellW, cellH);
            this.ctx.setLineDash([]); 
          }
        }
      },

      print: function() { window.print(); },

      /* --- 6. MẪU THIẾT ĐẶT --- */
      loadLogo: function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => { this.watermarkLogo = img; this.renderCanvas(); }
          img.src = evt.target.result;
        }
        reader.readAsDataURL(file);
      },
      saveTemplate: function() {
        const settings = {
          layout: document.getElementById('layoutSelect').value,
          text: document.getElementById('wmText').value,
          font: document.getElementById('wmFont').value,
          align: document.getElementById('wmAlign').value,
          color: document.getElementById('wmColor').value,
          outline: document.getElementById('wmOutline').value
        };
        localStorage.setItem('pb_template', JSON.stringify(settings));
        Swal.fire('Thành công', 'Đã lưu cài đặt hiện tại làm mẫu.', 'success');
      },
      loadTemplate: function() {
        const data = localStorage.getItem('pb_template');
        if(!data) return Swal.fire('Lỗi', 'Chưa có mẫu nào.', 'warning');
        const settings = JSON.parse(data);
        document.getElementById('layoutSelect').value = settings.layout;
        document.getElementById('wmText').value = settings.text;
        document.getElementById('wmFont').value = settings.font;
        document.getElementById('wmAlign').value = settings.align;
        document.getElementById('wmColor').value = settings.color;
        document.getElementById('wmOutline').value = settings.outline;
        this.changeLayout(); 
        Swal.fire('Thành công', 'Đã áp dụng mẫu.', 'success');
      }
    };

    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
