<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro PhotoBooth Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Tích hợp Google Fonts (Tiếng Việt) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Lora:ital,wght@0,600;1,600&family=Dancing+Script:wght@700&family=Oswald:wght@700&family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    /* HỆ THỐNG THEME */
    :root {
      --bg-color: #0b0f19; --panel-bg: rgba(15, 23, 42, 0.95); --card-bg: rgba(30, 41, 59, 0.95);
      --accent: #0ea5e9; --text-main: #f1f5f9; --border-color: rgba(14, 165, 233, 0.3); --accent-glow: 0 0 15px rgba(14,165,233,0.5);
      --input-bg: rgba(0,0,0,0.2); --input-border: rgba(255,255,255,0.1);
    }
    body.theme-professional { --bg-color: #e5e7eb; --panel-bg: #ffffff; --card-bg: #f9fafb; --accent: #111827; --text-main: #1f2937; --border-color: #d1d5db; --accent-glow: none; --input-bg: #fff; --input-border: #ccc; }
    body.theme-simple { --bg-color: #ffffff; --panel-bg: #f3f4f6; --card-bg: #ffffff; --accent: #3b82f6; --text-main: #000000; --border-color: #e5e7eb; --accent-glow: none; --input-bg: #fff; --input-border: #ddd; }
    body.theme-minimalist { --bg-color: #fafafa; --panel-bg: #ffffff; --card-bg: #ffffff; --accent: #000000; --text-main: #111111; --border-color: #eaeaea; --accent-glow: none; --input-bg: #fff; --input-border: #ccc; }
    body.theme-neon { --bg-color: #000000; --panel-bg: #111; --card-bg: #222; --accent: #39ff14; --text-main: #fff; --border-color: #39ff14; --accent-glow: 0 0 20px #39ff14; --input-bg: #000; --input-border: #39ff14; }
    body.theme-pastel { --bg-color: #fdf2f8; --panel-bg: #fff; --card-bg: #fdf2f8; --accent: #db2777; --text-main: #4c1d95; --border-color: #fbcfe8; --accent-glow: none; --input-bg: #fff; --input-border: #fbcfe8; }
    body.theme-retro { --bg-color: #fef3c7; --panel-bg: #fffbeb; --card-bg: #fde68a; --accent: #b45309; --text-main: #78350f; --border-color: #d97706; --accent-glow: none; --input-bg: #fff; --input-border: #d97706; }
    body.theme-dark { --bg-color: #121212; --panel-bg: #1e1e1e; --card-bg: #2d2d2d; --accent: #ffffff; --text-main: #ffffff; --border-color: #444444; --accent-glow: none; --input-bg: #333; --input-border: #555; }
    body.theme-bimgroup { --bg-color: #f0fdf4; --panel-bg: #ffffff; --card-bg: #ffffff; --accent: #047857; --text-main: #064e3b; --border-color: #a7f3d0; --accent-glow: 0 0 10px rgba(4,120,87,0.2); --input-bg: #fff; --input-border: #6ee7b7; }

    body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100vh; overflow: hidden; margin: 0; transition: 0.3s; }
    
    .offcanvas { background-color: var(--panel-bg) !important; color: var(--text-main) !important; border-left: 1px solid var(--border-color); }
    .form-control, .form-select { background-color: var(--input-bg) !important; color: var(--text-main) !important; border: 1px solid var(--input-border) !important; }
    .btn-close-custom { filter: invert(var(--invert-icon, 0)); }
    [data-bs-theme="light"] .btn-close-custom { filter: invert(1); }

    /* HEADER SIÊU NHỎ */
    .app-header { display: flex; justify-content: space-between; align-items: center; padding: 0 15px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); height: 35px; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    
    /* BỐ CỤC CHÍNH */
    .app-container { display: flex; height: calc(100vh - 35px); }
    .left-panel { flex: 6.5; display: flex; flex-direction: column; padding: 12px; border-right: 1px solid var(--border-color); overflow: hidden; background: transparent; }
    .right-panel { flex: 3.5; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; background: var(--card-bg); overflow: hidden; position: relative; }
    
    /* CAMERA VIEWPORT VÀ CỤM ĐIỀU KHIỂN (3 CỘT) */
    .camera-setup-row { display: flex; gap: 12px; margin-bottom: 12px; flex-shrink: 0; }
    
    .camera-control-col { width: 150px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .action-control-col { width: 140px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    
    .viewport-wrapper { flex: 1; position: relative; aspect-ratio: 16/9; max-height: 45vh; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--accent); box-shadow: var(--accent-glow); display: flex; align-items: center; justify-content: center; }
    .viewport-wrapper.vertical { aspect-ratio: 9/16; }
    #videoElement { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s; }
    
    .camera-modes { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 10; }
    .btn-cam-mode { background: rgba(0,0,0,0.6); color: white; border: 1px solid var(--accent); padding: 4px 8px; border-radius: 4px; cursor: pointer; backdrop-filter: blur(4px); }
    .btn-cam-mode.active { background: var(--accent); }
    
    /* ĐẾM NGƯỢC NỀN TRONG SUỐT */
    #countdownOverlay { position: absolute; inset: 0; background: transparent; display: none; align-items: center; justify-content: center; font-size: 140px; font-weight: 900; color: #fff; z-index: 9999; text-shadow: 0 0 20px rgba(0,0,0,0.9), 0 0 10px var(--accent); pointer-events: none; }

    /* GALLERY PHIÊN HIỆN TẠI (GRID 3 CỘT CUỘN DỌC) */
    .gallery-section { background: var(--panel-bg); padding: 12px; border-radius: 8px; border: 1px dashed var(--border-color); display: flex; flex-direction: column; flex: 1; min-height: 0; transition: 0.3s; }
    .gallery-section.dragover { border-color: var(--accent); border-style: solid; background: rgba(14, 165, 233, 0.05); }
    .gallery-title { font-size: 0.85rem; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; color: var(--accent); flex-shrink: 0; }
    
    .gallery-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: flex-start; flex: 1; overflow-y: auto; padding-right: 5px; }
    .gallery-container::-webkit-scrollbar { width: 5px; }
    .gallery-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    
    .thumb-wrapper { position: relative; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); background: #000; overflow: hidden; }
    .thumb-wrapper img { width: 100%; height: auto; display: block; object-fit: contain; cursor: grab; transition: 0.2s; }
    .thumb-wrapper:hover { transform: scale(1.03); z-index: 2; box-shadow: var(--accent-glow); border: 1px solid var(--accent); }
    .thumb-wrapper img:active { cursor: grabbing; }

    .btn-del-thumb { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; background: rgba(220, 53, 69, 0.85); color: #fff; border: none; border-radius: 50%; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; opacity: 0; transition: 0.2s; }
    .thumb-wrapper:hover .btn-del-thumb { opacity: 1; }
    .btn-del-thumb:hover { background: #dc3545; transform: scale(1.1); }

    /* UPLOAD PROGRESS */
    .progress-tiny { height: 4px; background-color: var(--input-bg); width: 120px; border-radius: 2px; overflow: hidden; display: none; margin-right: 10px; }
    .progress-bar-tiny { background-color: var(--accent); box-shadow: var(--accent-glow); transition: width 0.3s; height: 100%; }

    /* CANVAS TRANG IN */
    .canvas-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #finalCanvas { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; box-shadow: 0 5px 25px rgba(0,0,0,0.3); border: 1px solid var(--border-color); background: #fff; cursor: crosshair; }

    /* TOOLBAR TRỰC TIẾP */
    .slot-toolbar { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: var(--panel-bg); padding: 6px 12px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); visibility: hidden; opacity: 0; transition: 0.3s; border: 1px solid var(--border-color); z-index: 100; display: flex; gap: 6px; align-items: center; width: max-content; }
    .slot-toolbar.active { visibility: visible; opacity: 1; top: 20px; }

    /* NÚT THAO TÁC */
    .btn-primary-custom { background: var(--accent); color: var(--bg-color); border: none; font-weight: bold; box-shadow: var(--accent-glow); transition: 0.3s; }
    .btn-primary-custom:hover { filter: brightness(1.2); color: var(--bg-color); }
    .btn-outline-custom { background: transparent; border: 1px solid var(--accent); color: var(--text-main); transition: 0.3s; }
    .btn-outline-custom:hover { background: var(--accent); color: var(--bg-color); }

    @media print {
      body * { visibility: hidden; }
      #finalCanvas { visibility: visible; position: fixed; left: 0; top: 0; max-width: none; max-height: none; width: 100vw; height: 100vh; object-fit: cover; z-index: 9999; }
    }
  </style>
</head>
<body class="theme-bimgroup">

  <style id="printStyle"></style>
  <input type="file" id="slotFileInput" accept="image/*" onchange="app.handleSlotFile(event)" hidden>

  <!-- HEADER SIÊU NHỎ -->
  <div class="app-header">
    <div class="d-flex align-items-center gap-2">
      <img id="headerLogo" src="" alt="Logo" style="height: 20px; display: none;">
      <h6 id="headerTitleText" style="margin:0; font-size:0.85rem; font-weight:800; color:var(--accent); letter-spacing: 1px;">STUDIO BOOTH</h6>
    </div>
    <!-- CHUYỂN NÚT CÀI ĐẶT LÊN GÓC PHẢI -->
    <button class="btn btn-sm text-muted p-0" data-bs-toggle="offcanvas" data-bs-target="#settingsOffcanvas" title="Cài đặt">
      <i class="bi bi-gear-fill fs-6" style="color: var(--accent);"></i>
    </button>
  </div>

  <div class="app-container">
    
    <!-- CỘT TRÁI -->
    <div class="left-panel">
      
      <!-- HÀNG TRÊN: ĐIỀU KHIỂN | CAMERA | NÚT CÔNG CỤ -->
      <div class="camera-setup-row">
        
        <!-- Cột 1: Thông số Camera -->
        <div class="camera-control-col">
          <label class="small fw-bold mb-0" style="color:var(--accent)"><i class="bi bi-webcam"></i> Camera</label>
          <select id="cameraSelect" class="form-select form-select-sm mb-1" onchange="app.switchCamera()"></select>

          <div class="input-group input-group-sm">
            <span class="input-group-text bg-transparent text-muted border-secondary w-50" style="border-right: none;">Chụp</span>
            <input type="number" id="photoCount" class="form-control text-center border-secondary" style="border-left: none;" value="1" min="1">
          </div>

          <div class="input-group input-group-sm">
            <span class="input-group-text bg-transparent text-muted border-secondary w-50" style="border-right: none;">Đếm (s)</span>
            <input type="number" id="timerCount" class="form-control text-center border-secondary" style="border-left: none;" value="3" min="0">
          </div>

          <div class="input-group input-group-sm mb-1">
            <span class="input-group-text bg-transparent text-muted border-secondary w-50" style="border-right: none;">Nhân bản</span>
            <input type="number" id="autoCopies" class="form-control text-center border-secondary fw-bold" style="border-left: none; color: var(--accent);" value="1" min="1" max="8">
          </div>

          <button class="btn btn-primary-custom w-100 rounded shadow-sm py-2 mt-auto" onclick="app.startCaptureSession()">
            <i class="bi bi-camera-fill fs-5"></i>
          </button>
        </div>

        <!-- Cột 2: Khung Camera Live -->
        <div class="viewport-wrapper" id="viewport">
          <div class="camera-modes">
            <button class="btn-cam-mode active" id="btnModeH" onclick="app.setCameraMode('horizontal')"><i class="bi bi-phone-landscape"></i></button>
            <button class="btn-cam-mode" id="btnModeV" onclick="app.setCameraMode('vertical')"><i class="bi bi-phone"></i></button>
          </div>
          <video id="videoElement" autoplay playsinline></video>
          <div id="countdownOverlay">3</div>
        </div>
        
        <!-- Cột 3: Nút thao tác Layout -->
        <div class="action-control-col">
          <button class="btn btn-primary-custom w-100 btn-sm shadow mb-1 mt-auto" onclick="app.print()"><i class="bi bi-printer"></i> IN NGAY</button>
          <button class="btn btn-outline-custom w-100 btn-sm mb-1" onclick="app.saveLayoutToDrive()"><i class="bi bi-cloud-upload"></i> Lưu ảnh</button>
          <button class="btn btn-outline-danger w-100 btn-sm" onclick="app.clearLayout()"><i class="bi bi-trash"></i> Xóa trang</button>
        </div>

      </div>

      <!-- GALLERY: ẢNH PHIÊN HIỆN TẠI -->
      <div class="gallery-section" id="currentSessionZone"
           ondragover="app.handleDragOverSession(event)" ondragleave="app.handleDragLeaveSession(event)" ondrop="app.handleDropSession(event)">
        
        <div class="gallery-title">
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-images"></i> ẢNH PHIÊN HIỆN TẠI
            <span id="uploadStatusText" class="small text-muted fw-normal ms-2" style="font-size: 0.7rem; display: none;">Lưu: <span id="uploadCount">0/0</span></span>
            <div class="progress-tiny" id="uploadProgressBarContainer">
              <div class="progress-bar-tiny" id="uploadProgress" style="width: 0%"></div>
            </div>
          </div>
          <label class="btn btn-sm btn-outline-custom m-0 px-3 py-0 rounded-pill" style="cursor: pointer; font-size: 0.75rem;">
            + Thêm ảnh từ máy <input type="file" accept="image/*" multiple onchange="app.uploadToSession(event)" hidden>
          </label>
        </div>
        
        <!-- KHÔNG GIAN LƯỚI 3 CỘT -->
        <div class="gallery-container" id="capturedGallery">
          <span class="text-muted small w-100 text-center" style="padding: 20px; display: block; grid-column: 1 / -1;">Kéo thả ảnh từ thiết bị vào đây hoặc bấm chụp mới</span>
        </div>
      </div>
    </div>

    <!-- CỘT PHẢI: TRANG IN FULL DỌC -->
    <div class="right-panel">
      <!-- THANH CÔNG CỤ EDIT TRỰC TIẾP ĐÃ SỬA LỖI -->
      <div class="slot-toolbar" id="slotToolbar">
        <span class="badge bg-primary rounded-pill">#<span id="stIndex">1</span></span>
        <button class="btn btn-sm btn-outline-info rounded-circle py-0 px-1" onclick="document.getElementById('slotFileInput').click()" title="Thay ảnh"><i class="bi bi-image"></i></button>
        <button class="btn btn-sm btn-outline-secondary rounded-circle py-0 px-1" onclick="app.rotateActiveSlot()" title="Xoay 90 độ"><i class="bi bi-arrow-clockwise"></i></button>
        <div class="d-flex align-items-center gap-1 ms-1">
          <i class="bi bi-brightness-high text-warning" style="font-size:0.8rem;"></i>
          <input type="range" class="form-range" id="stBr" min="50" max="150" value="100" style="width: 40px;" oninput="app.applyDirectEdit()">
        </div>
        <div class="d-flex align-items-center gap-1 ms-1">
          <i class="bi bi-circle-half text-info" style="font-size:0.8rem;"></i>
          <input type="range" class="form-range" id="stCt" min="50" max="150" value="100" style="width: 40px;" oninput="app.applyDirectEdit()">
        </div>
        <button class="btn btn-sm btn-danger rounded-circle ms-1 py-0 px-1" onclick="app.removeActiveSlot()" title="Xóa ảnh khỏi khung"><i class="bi bi-x-lg"></i></button>
      </div>

      <!-- CANVAS MAX DIỆN TÍCH -->
      <div class="canvas-container">
        <canvas id="finalCanvas" ondragover="app.allowDrop(event)" ondrop="app.handleCanvasDrop(event)" title="Click để thêm hoặc chỉnh sửa ảnh"></canvas>
      </div>
    </div>
  </div>

  <!-- MODAL CHUẨN BỊ ẢNH CHUYÊN SÂU -->
  <div class="modal fade" id="imagePrepModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main);">
        <div class="modal-header border-bottom-0 pb-0">
          <h6 class="modal-title fw-bold">CHỈNH SỬA & CHÈN ẢNH</h6>
          <button type="button" class="btn-close btn-close-custom" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center pt-2">
          <div id="prepPreviewContainer" style="width:100%; height: 260px; overflow:hidden; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom:15px; background:#000; position:relative; cursor: grab;">
             <img id="prepPreview" src="" style="width:100%; height:100%; object-fit:contain; pointer-events: none;">
             <div style="position:absolute; bottom:5px; left:5px; font-size:9px; color:#fff; background:rgba(0,0,0,0.6); padding:2px 6px; border-radius:4px;">
                Cuộn: Zoom | Kéo: Di chuyển
             </div>
          </div>
          
          <div class="row g-2 text-start align-items-center">
            <div class="col-6"><label class="small text-muted m-0">Xén (Zoom)</label><input type="range" class="form-range" id="prepZoom" min="0.5" max="4" step="0.1" value="1" oninput="app.updatePrepPreview()"></div>
            <div class="col-6"><label class="small text-muted m-0">Xoay (°)</label><input type="range" class="form-range" id="prepRot" min="0" max="270" step="90" value="0" oninput="app.updatePrepPreview()"></div>
            <div class="col-6"><label class="small text-muted m-0">Độ sáng</label><input type="range" class="form-range" id="prepBr" min="50" max="150" value="100" oninput="app.updatePrepPreview()"></div>
            <div class="col-6"><label class="small text-muted m-0">Tương phản</label><input type="range" class="form-range" id="prepCt" min="50" max="150" value="100" oninput="app.updatePrepPreview()"></div>
            <input type="hidden" id="prepPanX" value="0"> <input type="hidden" id="prepPanY" value="0">

            <div class="col-12 mt-2 d-flex justify-content-between align-items-center bg-dark p-2 rounded">
              <label class="small text-muted m-0">Số lượng khung chèn:</label>
              <div class="btn-group input-group-sm" role="group">
                <button type="button" class="btn btn-outline-secondary py-0" onclick="app.adjustPrepCopies(-1)">-</button>
                <input type="number" id="prepCopies" value="1" min="1" max="8" class="form-control text-center bg-transparent fw-bold p-0" style="width: 40px; border-radius: 0; color: var(--accent);" readonly>
                <button type="button" class="btn btn-outline-secondary py-0" onclick="app.adjustPrepCopies(1)">+</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer border-top-0 pt-0 justify-content-center">
          <button type="button" class="btn btn-primary-custom w-100 rounded-pill" onclick="app.addToLayout()"><i class="bi bi-check2-circle"></i> Đưa vào Trang In</button>
        </div>
      </div>
    </div>
  </div>

  <!-- OFFCANVAS CÀI ĐẶT HỆ THỐNG CÓ LƯU BỘ NHỚ -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="settingsOffcanvas" style="width: 360px;">
    <div class="offcanvas-header border-bottom" style="border-color: var(--border-color);">
      <h6 class="offcanvas-title fw-bold">CÀI ĐẶT CHUNG</h6>
      <button type="button" class="btn-close btn-close-custom" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      
      <div class="mb-4">
        <label class="small text-muted fw-bold mb-1">Giao diện (Theme)</label>
        <select id="themeSelect" class="form-select form-select-sm" onchange="app.changeTheme(this.value); app.saveSettings()">
          <option value="tech">Công nghệ (Tech)</option>
          <option value="bimgroup" selected>Xanh BIMGroup</option>
          <option value="professional">Chuyên nghiệp (Trắng)</option>
          <option value="simple">Đơn giản (Xanh dương)</option>
          <option value="minimalist">Tối giản (Đen Trắng)</option>
          <option value="neon">Neon Gaming</option>
          <option value="pastel">Hồng Pastel</option>
          <option value="retro">Cổ điển (Retro)</option>
          <option value="dark">Dark Mode Thuần</option>
        </select>
      </div>

      <div class="mb-4">
        <h6 class="fw-bold text-uppercase small" style="color:var(--accent); border-bottom: 1px solid var(--border-color); padding-bottom: 4px;">Bố cục & Viền ảnh</h6>
        <select id="layoutSelect" class="form-select form-select-sm mb-3" onchange="app.changeLayout(); app.saveSettings()">
          <option value="1">10x15 cm (1 ảnh) - Khổ Ngang</option>
          <option value="2">6x9 cm (2 ô) - Khổ Dọc</option>
          <option value="4">4x6 cm (4 ô) - Khổ Ngang</option>
          <option value="8" selected>3x4 cm (8 ô) - Khổ Dọc (Khung nhỏ ngang)</option>
        </select>
        
        <label class="small text-muted w-100">Độ dày viền trắng khung ảnh <span id="vBorder" class="float-end text-white">0px</span></label>
        <input type="range" class="form-range" id="slotBorder" min="0" max="40" value="0" oninput="document.getElementById('vBorder').innerText=this.value+'px'; app.renderCanvas(); app.saveSettings()">
      </div>

      <div class="mb-4">
        <h6 class="fw-bold text-uppercase small" style="color:var(--accent); border-bottom: 1px solid var(--border-color); padding-bottom: 4px;">Watermark Trang In</h6>
        <input type="text" id="wmText" class="form-control form-control-sm mb-2" placeholder="Chữ in lên ảnh..." onkeyup="app.renderCanvas(); app.saveSettings()">
        <div class="row g-2 mb-2">
          <div class="col-6">
            <select id="wmFont" class="form-select form-select-sm" onchange="app.renderCanvas(); app.saveSettings()">
              <option value="Arial">Arial</option>
              <option value="'Times New Roman'">Times New Roman</option>
              <option value="Impact">Impact</option>
              <option value="Roboto">Roboto</option>
              <option value="Montserrat">Montserrat</option>
              <option value="'Open Sans'">Open Sans</option>
              <option value="Lora">Lora</option>
              <option value="Oswald">Oswald</option>
              <option value="'Dancing Script'">Dancing Script</option>
              <option value="Pacifico">Pacifico</option>
              <option value="'Playfair Display'">Playfair Display</option>
            </select>
          </div>
          <div class="col-6">
            <select id="wmAlign" class="form-select form-select-sm" onchange="app.renderCanvas(); app.saveSettings()">
              <option value="center">Căn Giữa</option>
              <option value="left">Căn Trái</option>
              <option value="right">Căn Phải</option>
            </select>
          </div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6 d-flex align-items-center gap-2">
            <input type="color" id="wmColor" class="form-control form-control-color p-0 border-0" value="#ffffff" onchange="app.renderCanvas(); app.saveSettings()" style="width:20px; height:20px; background:transparent;">
            <span class="small text-muted">Màu chữ</span>
          </div>
          <div class="col-6 d-flex align-items-center gap-2">
            <input type="color" id="wmOutline" class="form-control form-control-color p-0 border-0" value="#000000" onchange="app.renderCanvas(); app.saveSettings()" style="width:20px; height:20px; background:transparent;">
            <span class="small text-muted">Màu viền</span>
          </div>
        </div>

        <div class="row g-2 mb-2 align-items-center">
            <div class="col-6">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="wmHasOutline" checked onchange="app.renderCanvas(); app.saveSettings()">
                    <label class="form-check-label small text-muted">Có viền chữ</label>
                </div>
            </div>
            <div class="col-6"><label class="small text-muted m-0">Độ dày viền</label><input type="range" class="form-range" id="wmOutlineThick" min="1" max="15" value="5" oninput="app.renderCanvas(); app.saveSettings()"></div>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-12"><label class="small text-muted m-0">Cỡ chữ (%)</label><input type="range" class="form-range" id="wmSize" min="1" max="15" value="3" oninput="app.renderCanvas(); app.saveSettings()"></div>
            <div class="col-6"><label class="small text-muted m-0">Tọa độ X (%)</label><input type="range" class="form-range" id="wmX" min="0" max="100" value="50" oninput="app.renderCanvas(); app.saveSettings()"></div>
            <div class="col-6"><label class="small text-muted m-0">Tọa độ Y (%)</label><input type="range" class="form-range" id="wmY" min="0" max="100" value="95" oninput="app.renderCanvas(); app.saveSettings()"></div>
        </div>

        <h6 class="fw-bold text-uppercase small mt-3" style="color:var(--accent); border-bottom: 1px solid var(--border-color); padding-bottom: 4px;">Logo dán góc (Tệp PNG)</h6>
        <input type="file" class="form-control form-control-sm mb-2" accept="image/*" onchange="app.loadPrintLogo(event)">
        <div class="row g-2">
          <div class="col-4"><label class="small text-muted m-0">Size (%)</label><input type="range" class="form-range" id="logoSize" min="5" max="80" value="20" oninput="app.renderCanvas(); app.saveSettings()"></div>
          <div class="col-4"><label class="small text-muted m-0">Tọa độ X (%)</label><input type="range" class="form-range" id="logoX" min="0" max="100" value="95" oninput="app.renderCanvas(); app.saveSettings()"></div>
          <div class="col-4"><label class="small text-muted m-0">Tọa độ Y (%)</label><input type="range" class="form-range" id="logoY" min="0" max="100" value="95" oninput="app.renderCanvas(); app.saveSettings()"></div>
        </div>
      </div>
      
    </div>
  </div>

  <script>
    // URL API CỦA BẠN
    const API_URL = 'https://script.google.com/macros/s/AKfycby6_-gotKSFnMsAsvC_TXmqCEeibp339208kcTpuKF8c9DsSMH1WQ05U00MwlztEqRfYg/exec'; 

    const app = {
      video: document.getElementById('videoElement'),
      canvas: document.getElementById('finalCanvas'),
      ctx: document.getElementById('finalCanvas').getContext('2d'),
      stream: null,
      
      capturedPhotos: [], 
      layoutSlots: [], 
      printLogo: null,
      cameraMode: 'horizontal', 
      
      prepState: {}, 
      prepModalInstance: null,
      dragPayload: null,
      
      activeSlotIndex: -1,
      isPanning: false,
      startX: 0, startY: 0,
      
      totalToUpload: 0,
      totalUploaded: 0,

      init: async function() {
        this.prepModalInstance = new bootstrap.Modal(document.getElementById('imagePrepModal'));
        await this.loadDeviceList();
        this.startCamera();
        
        this.bindCanvasEvents();
        this.bindPrepModalEvents();
        
        // Load Settings từ LocalStorage (nếu có) trước khi thiết lập giao diện
        this.loadSettings();
      },

      /* --- LƯU & TẢI CÀI ĐẶT TỪ TRÌNH DUYỆT --- */
      saveSettings: function() {
          const settings = {
              theme: document.getElementById('themeSelect').value,
              layout: document.getElementById('layoutSelect').value,
              slotBorder: document.getElementById('slotBorder').value,
              wmText: document.getElementById('wmText').value,
              wmFont: document.getElementById('wmFont').value,
              wmAlign: document.getElementById('wmAlign').value,
              wmColor: document.getElementById('wmColor').value,
              wmOutline: document.getElementById('wmOutline').value,
              wmHasOutline: document.getElementById('wmHasOutline').checked,
              wmOutlineThick: document.getElementById('wmOutlineThick').value,
              wmX: document.getElementById('wmX').value,
              wmY: document.getElementById('wmY').value,
              wmSize: document.getElementById('wmSize').value,
              logoSize: document.getElementById('logoSize').value,
              logoX: document.getElementById('logoX').value,
              logoY: document.getElementById('logoY').value
          };
          localStorage.setItem('boothSettings_Pro', JSON.stringify(settings));
      },
      loadSettings: function() {
          const saved = localStorage.getItem('boothSettings_Pro');
          if (saved) {
              try {
                  const s = JSON.parse(saved);
                  if(s.theme) document.getElementById('themeSelect').value = s.theme;
                  if(s.layout) document.getElementById('layoutSelect').value = s.layout;
                  if(s.slotBorder) { document.getElementById('slotBorder').value = s.slotBorder; document.getElementById('vBorder').innerText = s.slotBorder + 'px'; }
                  if(s.wmText !== undefined) document.getElementById('wmText').value = s.wmText;
                  if(s.wmFont) document.getElementById('wmFont').value = s.wmFont;
                  if(s.wmAlign) document.getElementById('wmAlign').value = s.wmAlign;
                  if(s.wmColor) document.getElementById('wmColor').value = s.wmColor;
                  if(s.wmOutline) document.getElementById('wmOutline').value = s.wmOutline;
                  if(s.wmHasOutline !== undefined) document.getElementById('wmHasOutline').checked = s.wmHasOutline;
                  if(s.wmOutlineThick) document.getElementById('wmOutlineThick').value = s.wmOutlineThick;
                  if(s.wmX) document.getElementById('wmX').value = s.wmX;
                  if(s.wmY) document.getElementById('wmY').value = s.wmY;
                  if(s.wmSize) document.getElementById('wmSize').value = s.wmSize;
                  if(s.logoSize) document.getElementById('logoSize').value = s.logoSize;
                  if(s.logoX) document.getElementById('logoX').value = s.logoX;
                  if(s.logoY) document.getElementById('logoY').value = s.logoY;
              } catch(e){}
          }
          this.changeTheme(document.getElementById('themeSelect').value);
          this.changeLayout();
      },

      changeTheme: function(themeName) {
        document.body.className = `theme-${themeName}`;
        const lightThemes = ['professional', 'simple', 'minimalist', 'pastel', 'retro', 'bimgroup'];
        if(lightThemes.includes(themeName)) { document.documentElement.setAttribute('data-bs-theme', 'light'); } 
        else { document.documentElement.setAttribute('data-bs-theme', 'dark'); }
      },

      /* --- CAMERA --- */
      loadDeviceList: async function() {
        try {
          await navigator.mediaDevices.getUserMedia({ video: true });
          const devices = await navigator.mediaDevices.enumerateDevices();
          const v = devices.filter(d => d.kind === 'videoinput');
          const s = document.getElementById('cameraSelect'); s.innerHTML = '';
          v.forEach((d, i) => s.appendChild(new Option(d.label || `Cam ${i+1}`, d.deviceId)));
        } catch(e){}
      },
      startCamera: async function() {
        const id = document.getElementById('cameraSelect').value;
        if(this.stream) this.stream.getTracks().forEach(t => t.stop());
        try {
          const c = { video: id ? { deviceId: { exact: id }, width: {ideal:4096} } : { facingMode: "user", width: {ideal:4096} } };
          this.stream = await navigator.mediaDevices.getUserMedia(c);
          this.video.srcObject = this.stream;
        } catch(e){}
      },
      switchCamera: function() { this.startCamera(); },
      setCameraMode: function(mode) {
        this.cameraMode = mode;
        const wp = document.getElementById('viewport');
        document.getElementById('btnModeH').classList.remove('active'); document.getElementById('btnModeV').classList.remove('active');
        if(mode === 'horizontal') { wp.classList.remove('vertical'); this.video.style.transform = 'rotate(0deg)'; document.getElementById('btnModeH').classList.add('active'); } 
        else { wp.classList.add('vertical'); this.video.style.transform = 'rotate(90deg)'; document.getElementById('btnModeV').classList.add('active'); }
      },
      
      startCaptureSession: async function(targetSlot = -1) {
        const count = targetSlot !== -1 ? 1 : parseInt(document.getElementById('photoCount').value);
        const timer = parseInt(document.getElementById('timerCount').value);
        const vp = document.getElementById('viewport');
        const overlay = document.getElementById('countdownOverlay');

        if (vp.requestFullscreen && targetSlot === -1) { await vp.requestFullscreen().catch(err => console.log(err)); }

        for (let i = 0; i < count; i++) {
          overlay.style.display = 'flex';
          for (let t = timer; t > 0; t--) { overlay.innerText = t; await new Promise(r => setTimeout(r, 1000)); }
          overlay.style.display = 'none';
          
          vp.style.backgroundColor = '#fff'; this.video.style.opacity = 0;
          setTimeout(() => { vp.style.backgroundColor = '#000'; this.video.style.opacity = 1; }, 100);
          
          this.captureSingleFrame(targetSlot);
          if(i < count - 1) await new Promise(r => setTimeout(r, 1000));
        }

        if (document.fullscreenElement && targetSlot === -1) { document.exitFullscreen().catch(err => {}); }
      },
      captureSingleFrame: function(targetSlot) {
        const tCanvas = document.createElement('canvas'); const tCtx = tCanvas.getContext('2d');
        if (this.cameraMode === 'vertical') {
          tCanvas.width = this.video.videoHeight; tCanvas.height = this.video.videoWidth;
          tCtx.translate(tCanvas.width/2, tCanvas.height/2); tCtx.rotate(Math.PI/2);
          tCtx.drawImage(this.video, -this.video.videoWidth/2, -this.video.videoHeight/2);
        } else {
          tCanvas.width = this.video.videoWidth; tCanvas.height = this.video.videoHeight;
          tCtx.drawImage(this.video, 0, 0);
        }

        const b64 = tCanvas.toDataURL('image/jpeg', 1.0);
        const imgObj = new Image();
        const photoRecord = { imgObj: imgObj, driveId: null }; 

        imgObj.onload = () => {
          this.capturedPhotos.unshift(photoRecord);
          this.renderCapturedGallery();
          
          if(targetSlot !== -1) {
            this.layoutSlots[targetSlot] = { img: imgObj, zoom: 1, panX: 0, panY: 0, rotate: 0, br: 100, ct: 100 };
            this.activeSlotIndex = targetSlot;
            this.updateToolbarUI();
            this.renderCanvas();
          } else {
            const autoCopies = parseInt(document.getElementById('autoCopies').value) || 1;
            for(let c = 0; c < autoCopies; c++) {
               this.autoFillFirstEmptySlot(imgObj);
            }
          }
          
          if(API_URL) {
            this.totalToUpload++;
            document.getElementById('uploadStatusText').style.display = 'inline';
            document.getElementById('uploadProgressBarContainer').style.display = 'block';
            this.updateUploadUI();
            const fd = new URLSearchParams(); fd.append('image', b64); fd.append('fileName', 'Booth_' + new Date().getTime() + '.jpg');
            fetch(API_URL, { method: 'POST', body: fd }).then(r=>r.json()).then(r=>{ 
               if(r.success) { photoRecord.driveId = r.id; this.totalUploaded++; this.updateUploadUI(); } 
            }).catch(()=>{ this.updateUploadUI(); });
          }
        };
        imgObj.src = b64;
      },
      updateUploadUI: function() {
        document.getElementById('uploadCount').innerText = `${this.totalUploaded}/${this.totalToUpload}`;
        let percent = this.totalToUpload > 0 ? Math.round((this.totalUploaded/this.totalToUpload)*100) : 0;
        document.getElementById('uploadProgress').style.width = percent + '%';
        if(this.totalUploaded >= this.totalToUpload && this.totalToUpload > 0) {
          setTimeout(() => { 
             document.getElementById('uploadStatusText').style.display = 'none'; 
             document.getElementById('uploadProgressBarContainer').style.display = 'none'; 
             this.totalUploaded = 0; this.totalToUpload = 0; document.getElementById('uploadProgress').style.width = '0%';
          }, 2000);
        }
      },

      /* --- QUẢN LÝ ẢNH LOCAL CỦA PHIÊN --- */
      handleDragOverSession: function(e) { e.preventDefault(); document.getElementById('currentSessionZone').classList.add('dragover'); },
      handleDragLeaveSession: function(e) { e.preventDefault(); document.getElementById('currentSessionZone').classList.remove('dragover'); },
      handleDropSession: function(e) { e.preventDefault(); document.getElementById('currentSessionZone').classList.remove('dragover'); this.processLocalFiles(e.dataTransfer.files); },
      uploadToSession: function(e) { this.processLocalFiles(e.target.files); },
      processLocalFiles: function(files) {
        for(let file of files) {
          if(!file.type.startsWith('image/')) continue;
          const r = new FileReader();
          r.onload = (evt) => { 
            const b64 = evt.target.result;
            const img = new Image(); 
            const photoRecord = { imgObj: img, driveId: null };
            img.onload = () => { 
              this.capturedPhotos.unshift(photoRecord); 
              this.renderCapturedGallery(); 
              
              if(API_URL) {
                this.totalToUpload++;
                document.getElementById('uploadStatusText').style.display = 'inline';
                document.getElementById('uploadProgressBarContainer').style.display = 'block';
                this.updateUploadUI();
                const fd = new URLSearchParams(); fd.append('image', b64); fd.append('fileName', 'Local_' + new Date().getTime() + '.jpg');
                fetch(API_URL, { method: 'POST', body: fd }).then(res=>res.json()).then(res=>{ 
                   if(res.success) { photoRecord.driveId = res.id; this.totalUploaded++; this.updateUploadUI(); } 
                }).catch(()=>{ this.updateUploadUI(); });
              }
            }; 
            img.src = b64; 
          };
          r.readAsDataURL(file);
        }
      },
      renderCapturedGallery: function() {
        const cap = document.getElementById('capturedGallery'); cap.innerHTML = '';
        this.capturedPhotos.forEach((record, index) => {
          const wrapper = document.createElement('div'); wrapper.className = 'thumb-wrapper';
          
          const img = document.createElement('img'); img.src = record.imgObj.src; 
          img.draggable = true; img.ondragstart = () => { this.dragPayload = record.imgObj; };
          img.onclick = () => { this.openPrepModal(record.imgObj); };
          
          const btnDel = document.createElement('button');
          btnDel.className = 'btn-del-thumb'; btnDel.innerHTML = '<i class="bi bi-x"></i>';
          btnDel.onclick = (e) => { e.stopPropagation(); this.deleteSessionPhoto(index); };

          wrapper.appendChild(img); wrapper.appendChild(btnDel); cap.appendChild(wrapper);
        });
        if(this.capturedPhotos.length === 0) cap.innerHTML = '<span class="text-muted small w-100 text-center" style="padding: 20px; grid-column: 1 / -1;">Kéo thả file vào đây hoặc bấm chụp mới</span>';
      },
      deleteSessionPhoto: function(index) {
        const record = this.capturedPhotos[index];
        Swal.fire({
          title: 'Xóa ảnh này?', text: "Ảnh sẽ bị xóa khỏi Web và Google Drive.", icon: 'warning',
          showCancelButton: true, confirmButtonText: 'Đồng ý', cancelButtonText: 'Hủy'
        }).then((result) => {
          if (result.isConfirmed) {
            if(record.driveId && API_URL) {
              const fd = new URLSearchParams(); fd.append('action', 'deleteDriveFile'); fd.append('fileId', record.driveId);
              fetch(API_URL, { method: 'POST', body: fd }).catch(e=>console.log(e));
            }
            this.capturedPhotos.splice(index, 1);
            this.renderCapturedGallery();
            
            for(let i=0; i<this.layoutSlots.length; i++) {
              if(this.layoutSlots[i] && this.layoutSlots[i].img.src === record.imgObj.src) { this.layoutSlots[i] = null; }
            }
            this.renderCanvas();
          }
        });
      },

      /* --- MODAL CHUẨN BỊ ẢNH --- */
      bindPrepModalEvents: function() {
        const prepC = document.getElementById('prepPreviewContainer');
        prepC.addEventListener('wheel', (e) => {
          e.preventDefault();
          let z = parseFloat(document.getElementById('prepZoom').value);
          z += (e.deltaY > 0 ? -0.1 : 0.1);
          document.getElementById('prepZoom').value = Math.max(0.5, Math.min(4, z));
          this.updatePrepPreview();
        }, { passive: false });
        
        let isPrepPan = false; let pX = 0, pY = 0;
        prepC.addEventListener('mousedown', (e) => { isPrepPan = true; pX = e.clientX; pY = e.clientY; prepC.style.cursor = 'grabbing'; });
        window.addEventListener('mouseup', () => { isPrepPan = false; prepC.style.cursor = 'grab'; });
        prepC.addEventListener('mousemove', (e) => {
          if(!isPrepPan) return;
          let panX = parseFloat(document.getElementById('prepPanX').value);
          let panY = parseFloat(document.getElementById('prepPanY').value);
          panX += (e.clientX - pX) * 0.5; panY += (e.clientY - pY) * 0.5;
          document.getElementById('prepPanX').value = panX; document.getElementById('prepPanY').value = panY;
          pX = e.clientX; pY = e.clientY;
          this.updatePrepPreview();
        });
      },
      openPrepModal: function(imgObj) {
        this.prepState = { img: imgObj, zoom: 1, rot: 0, panX: 0, panY: 0, br: 100, ct: 100 };
        document.getElementById('prepPreview').src = imgObj.src;
        document.getElementById('prepZoom').value = 1; document.getElementById('prepRot').value = 0;
        document.getElementById('prepPanX').value = 0; document.getElementById('prepPanY').value = 0;
        document.getElementById('prepBr').value = 100; document.getElementById('prepCt').value = 100;
        document.getElementById('prepCopies').value = 1;
        this.updatePrepPreview();
        this.prepModalInstance.show();
      },
      updatePrepPreview: function() {
        const s = this.prepState;
        s.zoom = parseFloat(document.getElementById('prepZoom').value); s.rot = parseInt(document.getElementById('prepRot').value);
        s.panX = parseFloat(document.getElementById('prepPanX').value); s.panY = parseFloat(document.getElementById('prepPanY').value);
        s.br = parseInt(document.getElementById('prepBr').value); s.ct = parseInt(document.getElementById('prepCt').value);
        
        const preview = document.getElementById('prepPreview');
        preview.style.transform = `translate(${s.panX}px, ${s.panY}px) scale(${s.zoom}) rotate(${s.rot}deg)`;
        preview.style.filter = `brightness(${s.br}%) contrast(${s.ct}%)`;
      },
      adjustPrepCopies: function(val) {
        const input = document.getElementById('prepCopies');
        let current = parseInt(input.value) + val;
        if(current < 1) current = 1; if(current > 8) current = 8;
        input.value = current;
      },
      addToLayout: function() {
        const copies = parseInt(document.getElementById('prepCopies').value);
        const maxSlots = this.getLayoutConfig().cols * this.getLayoutConfig().rows;
        let addedCount = 0;

        for(let i = 0; i < maxSlots; i++) {
          if(!this.layoutSlots[i]) {
            const cvsPanX = this.prepState.panX * 2; const cvsPanY = this.prepState.panY * 2;
            this.layoutSlots[i] = { img: this.prepState.img, zoom: this.prepState.zoom, panX: cvsPanX, panY: cvsPanY, rotate: this.prepState.rot, br: this.prepState.br, ct: this.prepState.ct };
            addedCount++;
            if(addedCount >= copies) break;
          }
        }
        this.renderCanvas();
        this.prepModalInstance.hide();
      },

      /* --- BỐ CỤC IN (LAYOUT) --- */
      getLayoutConfig: function() {
        const val = parseInt(document.getElementById('layoutSelect').value);
        if(val === 2) return { cols: 1, rows: 2 };
        if(val === 4) return { cols: 2, rows: 2 };
        if(val === 8) return { cols: 2, rows: 4 }; 
        return { cols: 1, rows: 1 };
      },
      changeLayout: function() {
        const val = parseInt(document.getElementById('layoutSelect').value);
        this.layoutSlots = new Array(val).fill(null);
        this.activeSlotIndex = -1; this.updateToolbarUI();
        const ps = document.getElementById('printStyle');

        if (val === 2 || val === 8) {
          this.canvas.width = 1200; this.canvas.height = 1800;
          ps.innerHTML = `@media print { @page { size: 4in 6in; margin: 0; } }`;
        } else {
          this.canvas.width = 1800; this.canvas.height = 1200;
          ps.innerHTML = `@media print { @page { size: 6in 4in; margin: 0; } }`;
        }
        this.renderCanvas();
      },
      clearLayout: function() { this.changeLayout(); },

      // THAO TÁC TRỰC TIẾP TRÊN CANVAS
      bindCanvasEvents: function() {
        const cvs = this.canvas;
        cvs.addEventListener('mousedown', (e) => {
          const index = this.getSlotIndexFromEvent(e);
          if(index !== -1) {
            this.activeSlotIndex = index;
            if (this.layoutSlots[index]) {
               this.isPanning = true; this.startX = e.clientX; this.startY = e.clientY;
            } else {
               // CLICK Ô TRỐNG
               Swal.fire({
                 title: 'Thêm ảnh vào khung', showCancelButton: true, showDenyButton: true,
                 confirmButtonText: '<i class="bi bi-camera"></i> Chụp ngay', denyButtonText: '<i class="bi bi-folder2-open"></i> Tải file', cancelButtonText: 'Đóng',
                 customClass: { confirmButton: 'btn btn-primary-custom mx-1', denyButton: 'btn btn-outline-custom mx-1' }
               }).then((res) => {
                 if(res.isConfirmed) { this.startCaptureSession(index); } 
                 else if (res.isDenied) { document.getElementById('slotFileInput').click(); }
               });
            }
            this.updateToolbarUI(); this.renderCanvas(); 
          } else { this.activeSlotIndex = -1; this.updateToolbarUI(); this.renderCanvas(); }
        });
        cvs.addEventListener('mousemove', (e) => {
          if(!this.isPanning || this.activeSlotIndex === -1) return;
          const slot = this.layoutSlots[this.activeSlotIndex];
          const rect = cvs.getBoundingClientRect();
          slot.panX += (e.clientX - this.startX) * (cvs.width / rect.width) / slot.zoom;
          slot.panY += (e.clientY - this.startY) * (cvs.height / rect.height) / slot.zoom;
          this.startX = e.clientX; this.startY = e.clientY;
          this.renderCanvas();
        });
        window.addEventListener('mouseup', () => { this.isPanning = false; });
        
        cvs.addEventListener('wheel', (e) => {
          e.preventDefault();
          const index = this.getSlotIndexFromEvent(e);
          if(index !== -1 && this.layoutSlots[index]) {
            this.activeSlotIndex = index;
            this.layoutSlots[index].zoom = Math.max(0.5, Math.min(4, this.layoutSlots[index].zoom + (e.deltaY > 0 ? -0.05 : 0.05)));
            this.updateToolbarUI(); this.renderCanvas();
          }
        }, { passive: false });
        cvs.addEventListener('dblclick', (e) => {
          const index = this.getSlotIndexFromEvent(e);
          if(index !== -1 && this.layoutSlots[index]) {
            this.layoutSlots[index].rotate = (this.layoutSlots[index].rotate + 90) % 360;
            this.renderCanvas();
          }
        });
      },
      allowDrop: function(e) { e.preventDefault(); },
      handleCanvasDrop: function(e) {
        e.preventDefault();
        if(!this.dragPayload) return;
        const index = this.getSlotIndexFromEvent(e);
        if(index !== -1) {
          this.layoutSlots[index] = { img: this.dragPayload, zoom: 1, panX: 0, panY: 0, rotate: 0, br: 100, ct: 100 };
          this.activeSlotIndex = index; this.updateToolbarUI(); this.renderCanvas();
        }
        this.dragPayload = null;
      },
      getSlotIndexFromEvent: function(e) {
        const rect = this.canvas.getBoundingClientRect();
        const config = this.getLayoutConfig();
        const col = Math.floor(((e.clientX - rect.left) * (this.canvas.width / rect.width)) / (this.canvas.width / config.cols));
        const row = Math.floor(((e.clientY - rect.top) * (this.canvas.height / rect.height)) / (this.canvas.height / config.rows));
        if (col >= 0 && col < config.cols && row >= 0 && row < config.rows) return row * config.cols + col;
        return -1;
      },
      updateToolbarUI: function() {
        const tb = document.getElementById('slotToolbar');
        if (this.activeSlotIndex !== -1 && this.layoutSlots[this.activeSlotIndex]) {
          tb.classList.add('active');
          document.getElementById('stIndex').innerText = this.activeSlotIndex + 1;
          document.getElementById('stBr').value = this.layoutSlots[this.activeSlotIndex].br;
          document.getElementById('stCt').value = this.layoutSlots[this.activeSlotIndex].ct;
        } else { tb.classList.remove('active'); }
      },
      applyDirectEdit: function() {
        if(this.activeSlotIndex === -1 || !this.layoutSlots[this.activeSlotIndex]) return;
        this.layoutSlots[this.activeSlotIndex].br = parseInt(document.getElementById('stBr').value);
        this.layoutSlots[this.activeSlotIndex].ct = parseInt(document.getElementById('stCt').value);
        this.renderCanvas();
      },
      rotateActiveSlot: function() { if(this.activeSlotIndex === -1) return; this.layoutSlots[this.activeSlotIndex].rotate = (this.layoutSlots[this.activeSlotIndex].rotate + 90) % 360; this.renderCanvas(); },
      removeActiveSlot: function() { if(this.activeSlotIndex === -1) return; this.layoutSlots[this.activeSlotIndex] = null; this.activeSlotIndex = -1; this.updateToolbarUI(); this.renderCanvas(); },
      handleSlotFile: function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const r = new FileReader();
        r.onload = (evt) => { 
           const b64 = evt.target.result;
           const img = new Image(); 
           img.onload = () => { 
              if (this.activeSlotIndex !== -1) {
                 if (this.layoutSlots[this.activeSlotIndex]) { this.layoutSlots[this.activeSlotIndex].img = img; } 
                 else { this.layoutSlots[this.activeSlotIndex] = { img: img, zoom: 1, panX: 0, panY: 0, rotate: 0, br: 100, ct: 100 }; }
                 this.renderCanvas(); this.updateToolbarUI();
              }
              
              if(API_URL) {
                this.totalToUpload++;
                document.getElementById('uploadStatusText').style.display = 'inline';
                document.getElementById('uploadProgressBarContainer').style.display = 'block';
                this.updateUploadUI();
                const fd = new URLSearchParams(); fd.append('image', b64); fd.append('fileName', 'Replaced_' + new Date().getTime() + '.jpg');
                fetch(API_URL, { method: 'POST', body: fd }).then(r=>r.json()).then(r=>{ 
                   if(r.success) { this.totalUploaded++; this.updateUploadUI(); } 
                }).catch(()=>{ this.updateUploadUI(); });
              }
           }; 
           img.src = b64; 
        };
        r.readAsDataURL(file); e.target.value = ''; 
      },

      /* --- RENDER CANVAS --- */
      renderCanvas: function() {
        const cw = this.canvas.width; const ch = this.canvas.height;
        this.ctx.clearRect(0, 0, cw, ch);
        this.ctx.fillStyle = "#ffffff"; this.ctx.fillRect(0, 0, cw, ch);

        const config = this.getLayoutConfig();
        const cellW = cw / config.cols; const cellH = ch / config.rows;
        const sBorder = parseInt(document.getElementById('slotBorder').value) || 0;

        for(let r = 0; r < config.rows; r++) {
          for(let c = 0; c < config.cols; c++) {
            const index = r * config.cols + c;
            const slot = this.layoutSlots[index];
            const x = c * cellW; const y = r * cellH;

            if (slot) {
              this.ctx.save();
              this.ctx.beginPath(); this.ctx.rect(x, y, cellW, cellH); this.ctx.clip(); 
              this.ctx.filter = `brightness(${slot.br}%) contrast(${slot.ct}%)`;

              const imgRatio = slot.img.width / slot.img.height;
              const isRotated = (slot.rotate === 90 || slot.rotate === 270);
              let targetRatio = isRotated ? (cellH / cellW) : (cellW / cellH);
              
              let drawW = cellW, drawH = cellH;
              if (imgRatio > targetRatio) { drawW = cellH * imgRatio; } else { drawH = cellW / imgRatio; }
              if(isRotated) { if (imgRatio > (cellH/cellW)) { drawH = cellW; drawW = cellW * imgRatio; } else { drawW = cellH; drawH = cellH / imgRatio; } }

              this.ctx.translate(x + cellW / 2, y + cellH / 2);
              this.ctx.translate(slot.panX, slot.panY); 
              this.ctx.scale(slot.zoom, slot.zoom);     
              this.ctx.rotate(slot.rotate * Math.PI / 180); 
              this.ctx.drawImage(slot.img, -drawW / 2, -drawH / 2, drawW, drawH);
              this.ctx.restore(); 
              
              if(sBorder > 0) { this.ctx.lineWidth = sBorder * 2; this.ctx.strokeStyle = "#ffffff"; this.ctx.strokeRect(x, y, cellW, cellH); }
            } else {
              this.ctx.fillStyle = "#f1f5f9"; this.ctx.fillRect(x, y, cellW, cellH);
              this.ctx.fillStyle = "#94a3b8"; this.ctx.font = "24px Arial"; this.ctx.textAlign = "center"; this.ctx.textBaseline = "middle";
              this.ctx.fillText("Bấm để chụp / chèn ảnh", x + cellW/2, y + cellH/2);
            }
            
            if (this.activeSlotIndex === index) {
              this.ctx.strokeStyle = "rgba(14, 165, 233, 0.8)"; this.ctx.lineWidth = 15; this.ctx.strokeRect(x, y, cellW, cellH);
            } else {
              this.ctx.strokeStyle = "#cbd5e1"; this.ctx.lineWidth = 2; this.ctx.setLineDash([10, 10]); this.ctx.strokeRect(x, y, cellW, cellH); this.ctx.setLineDash([]); 
            }
          }
        }
        
        if (this.printLogo) { 
          const logoScale = parseInt(document.getElementById('logoSize').value) / 100;
          const posX = parseInt(document.getElementById('logoX').value) / 100;
          const posY = parseInt(document.getElementById('logoY').value) / 100;
          
          const logoW = cw * logoScale; 
          const logoH = (this.printLogo.height / this.printLogo.width) * logoW;
          
          const lx = (cw - logoW) * posX; 
          const ly = (ch - logoH) * posY;
          this.ctx.drawImage(this.printLogo, lx, ly, logoW, logoH); 
        }

        const text = document.getElementById('wmText').value;
        if (text) {
          const sizePct = parseInt(document.getElementById('wmSize').value) / 100;
          const fontSize = ch * sizePct;
          this.ctx.font = `bold ${fontSize}px ${document.getElementById('wmFont').value}`;
          this.ctx.fillStyle = document.getElementById('wmColor').value;
          this.ctx.textBaseline = "middle";
          this.ctx.textAlign = document.getElementById('wmAlign').value;
          
          const wmX = parseInt(document.getElementById('wmX').value) / 100;
          const wmY = parseInt(document.getElementById('wmY').value) / 100;
          
          let textX = cw * wmX;
          let textY = ch * wmY;
          
          if(document.getElementById('wmHasOutline').checked) {
              this.ctx.strokeStyle = document.getElementById('wmOutline').value;
              this.ctx.lineWidth = parseInt(document.getElementById('wmOutlineThick').value);
              this.ctx.strokeText(text, textX, textY);
          }
          this.ctx.fillText(text, textX, textY);
        }
      },
      
      print: function() { this.activeSlotIndex = -1; this.updateToolbarUI(); this.renderCanvas(); setTimeout(() => { window.print(); }, 300); },
      saveLayoutToDrive: function() {
        if(this.layoutSlots.every(s => s === null)) return Swal.fire('Lỗi', 'Trang in trống', 'error');
        this.activeSlotIndex = -1; this.updateToolbarUI(); this.renderCanvas();
        const b64 = this.canvas.toDataURL('image/jpeg', 0.9);
        const fd = new URLSearchParams(); fd.append('image', b64); fd.append('fileName', 'Print_Layout_' + new Date().getTime() + '.jpg');
        Swal.fire({title: 'Đang lưu...', didOpen: () => Swal.showLoading()});
        fetch(API_URL, { method: 'POST', body: fd }).then(r=>r.json()).then(r=>{
          if(r.success) Swal.fire('Thành công', 'Đã lưu bố cục lên Drive', 'success'); else Swal.fire('Lỗi', 'Có lỗi xảy ra', 'error');
        }).catch(()=>Swal.fire('Lỗi', 'Mạng không ổn định', 'error'));
      },
      loadPrintLogo: function(e) {
        if(!e.target.files[0]) return;
        const r = new FileReader();
        r.onload = (evt) => { const img = new Image(); img.onload = () => { this.printLogo = img; this.renderCanvas(); }; img.src = evt.target.result; }
        r.readAsDataURL(e.target.files[0]);
      },
      autoFillFirstEmptySlot: function(imgObj) {
        const conf = this.getLayoutConfig();
        for(let i=0; i<conf.cols * conf.rows; i++) {
          if(!this.layoutSlots[i]) {
            this.layoutSlots[i] = { img: imgObj, zoom: 1, panX: 0, panY: 0, rotate: 0, br: 100, ct: 100 };
            this.renderCanvas();
            break;
          }
        }
      }
    };
    
    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
