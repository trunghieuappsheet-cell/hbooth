<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro PhotoBooth - Tech Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    /* HIGH-TECH THEME VARIABLES */
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(15, 23, 42, 0.7);
      --card-bg: rgba(30, 41, 59, 0.8);
      --accent: #0ea5e9;
      --accent-glow: 0 0 15px rgba(14, 165, 233, 0.5);
      --text-main: #f1f5f9;
      --border-color: rgba(14, 165, 233, 0.2);
    }

    [data-bs-theme="light"] {
      --bg-color: #f8fafc;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --card-bg: rgba(241, 245, 249, 0.9);
      --accent: #0284c7;
      --accent-glow: 0 0 10px rgba(2, 132, 199, 0.2);
      --text-main: #0f172a;
      --border-color: rgba(2, 132, 199, 0.2);
    }

    body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; overflow: hidden; margin: 0; transition: background 0.3s; }
    
    /* GLASSMORPHISM HEADER (Fix lỗi che nút cài đặt) */
    .app-header { display: flex; justify-content: space-between; align-items: center; padding: 0 25px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); height: 65px; backdrop-filter: blur(10px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); z-index: 1000; position: relative; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header-left h4 { margin: 0; font-weight: 800; letter-spacing: 1px; color: var(--accent); text-shadow: var(--accent-glow); }
    #headerLogo { height: 40px; display: none; filter: drop-shadow(0 0 5px var(--accent)); }
    
    /* MAIN LAYOUT */
    .app-container { display: flex; height: calc(100vh - 65px); }
    .left-panel { flex: 4; display: flex; flex-direction: column; padding: 20px; border-right: 1px solid var(--border-color); background: transparent; overflow-y: auto; }
    .right-panel { flex: 6; display: flex; flex-direction: column; padding: 20px; background: var(--card-bg); position: relative; overflow: hidden; }
    
    /* CAMERA VIEWPORT */
    .viewport-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--accent); box-shadow: var(--accent-glow); display: flex; align-items: center; justify-content: center; }
    .viewport-wrapper.vertical { aspect-ratio: 9/16; max-height: 35vh; }
    #videoElement { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    
    .camera-modes { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 10; }
    .btn-cam-mode { background: rgba(0,0,0,0.5); color: white; border: 1px solid var(--accent); padding: 5px 12px; border-radius: 6px; cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s; }
    .btn-cam-mode.active { background: var(--accent); box-shadow: var(--accent-glow); }
    #countdownOverlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; font-size: 120px; font-weight: 900; color: var(--accent); z-index: 50; text-shadow: var(--accent-glow); }

    /* TECH GALLERIES */
    .gallery-section { margin-top: 15px; background: var(--panel-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); backdrop-filter: blur(5px); }
    .gallery-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; color: var(--accent); letter-spacing: 0.5px; }
    .gallery-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; min-height: 90px; align-items: center; }
    
    .thumb-item { width: 65px; height: 95px; object-fit: cover; border: 2px solid transparent; border-radius: 6px; cursor: grab; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .thumb-item:active { cursor: grabbing; transform: scale(0.9); }
    .thumb-item:hover { border-color: var(--accent); box-shadow: var(--accent-glow); }

    /* CANVAS BỐ CỤC IN */
    .canvas-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-top: 15px; }
    .canvas-wrapper { max-height: 100%; max-width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; background: #fff; display: flex; }
    #finalCanvas { max-height: 100%; max-width: 100%; object-fit: contain; cursor: grab; transition: box-shadow 0.3s; }
    #finalCanvas:active { cursor: grabbing; }

    /* FLOATING TOOLBAR CHO CHỈNH SỬA ẢNH */
    .slot-toolbar { background: var(--panel-bg); padding: 10px 20px; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); visibility: hidden; opacity: 0; transition: 0.3s; border: 1px solid var(--border-color); backdrop-filter: blur(10px); }
    .slot-toolbar.active { visibility: visible; opacity: 1; transform: translateY(-5px); }

    .progress { height: 4px; background-color: rgba(255,255,255,0.1); flex-grow: 1; margin: 0 10px; border-radius: 2px; }
    .progress-bar { background-color: var(--accent); box-shadow: var(--accent-glow); transition: width 0.3s; }

    /* NÚT THAO TÁC CÔNG NGHỆ */
    .btn-tech { background: var(--panel-bg); color: var(--text-main); border: 1px solid var(--accent); transition: 0.3s; }
    .btn-tech:hover { background: var(--accent); color: #fff; box-shadow: var(--accent-glow); }
    .btn-tech-primary { background: var(--accent); color: #fff; font-weight: bold; border: none; box-shadow: var(--accent-glow); transition: 0.3s; }
    .btn-tech-primary:hover { filter: brightness(1.2); }

    @media print {
      body * { visibility: hidden; }
      #finalCanvas { visibility: visible; position: fixed; left: 0; top: 0; max-width: none; max-height: none; width: 100vw; height: 100vh; object-fit: cover; z-index: 9999; }
    }
  </style>
</head>
<body>

  <style id="printStyle"></style>

  <!-- APP HEADER MỚI (Nơi chứa nút Cài đặt) -->
  <div class="app-header">
    <div class="header-left">
      <img id="headerLogo" src="" alt="Logo">
      <h4 id="headerTitleText">PRO PHOTOBOOTH STUDIO</h4>
    </div>
    <div class="d-flex gap-3">
      <button class="btn btn-tech btn-sm rounded-pill px-3" onclick="app.toggleTheme()">
        <i class="bi bi-moon-stars" id="themeIcon"></i> Theme
      </button>
      <button class="btn btn-tech-primary btn-sm rounded-pill px-4" data-bs-toggle="offcanvas" data-bs-target="#settingsOffcanvas">
        <i class="bi bi-sliders"></i> Cài đặt Hệ thống
      </button>
    </div>
  </div>

  <div class="app-container">
    
    <!-- CỘT TRÁI -->
    <div class="left-panel">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-uppercase fw-bold" style="color: var(--accent); letter-spacing: 1px;"><i class="bi bi-webcam"></i> Nguồn Camera</span>
        <select id="cameraSelect" class="form-select form-select-sm w-50 bg-transparent text-white border-info" onchange="app.switchCamera()">
          <option>Đang tải...</option>
        </select>
      </div>

      <div class="viewport-wrapper" id="viewport">
        <div class="camera-modes">
          <button class="btn-cam-mode active" id="btnModeH" onclick="app.setCameraMode('horizontal')" title="Ngang"><i class="bi bi-phone-landscape"></i></button>
          <button class="btn-cam-mode" id="btnModeV" onclick="app.setCameraMode('vertical')" title="Dọc"><i class="bi bi-phone"></i></button>
        </div>
        <video id="videoElement" autoplay playsinline></video>
        <div id="countdownOverlay">3</div>
      </div>

      <div class="d-flex justify-content-center mt-3 mb-2">
        <button class="btn btn-tech-primary btn-lg rounded-pill px-5 w-100" onclick="app.startCaptureSession()">
          <i class="bi bi-camera-fill me-2"></i> KÍCH HOẠT CHỤP
        </button>
      </div>

      <!-- GALLERY: ẢNH TỪ FOLDER DRIVE -->
      <div class="gallery-section">
        <div class="gallery-title">
          <span><i class="bi bi-cloud-check"></i> Ảnh từ Cloud (Gần nhất)</span>
          <button class="btn btn-sm btn-outline-info py-0 px-2" onclick="app.fetchFolderImages()" title="Làm mới">
            <i class="bi bi-arrow-repeat"></i> Sync
          </button>
        </div>
        <div class="gallery-container" id="cloudGallery">
           <span class="text-muted small w-100 text-center" id="cloudStatusText">Đang đồng bộ...</span>
        </div>
      </div>

      <!-- GALLERY: ẢNH VỪA CHỤP -->
      <div class="gallery-section">
        <div class="gallery-title">
          <span><i class="bi bi-images"></i> Ảnh phiên hiện tại</span>
        </div>
        <div class="gallery-container" id="capturedGallery">
          <span class="text-muted small w-100 text-center">Trống</span>
        </div>
        <div class="d-flex align-items-center mt-2 small text-info" id="uploadStatusUI" style="display: none !important;">
          Đang tải lên: <span id="uploadCount" class="ms-1 fw-bold">0/0</span>
          <div class="progress"><div class="progress-bar" id="uploadProgress" style="width: 0%"></div></div>
        </div>
      </div>
      
      <!-- NÚT TẢI LÊN TỪ MÁY/LINK -->
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-tech btn-sm w-50" onclick="app.importFromDriveLink()">
          <i class="bi bi-link-45deg"></i> Nhập Link Drive
        </button>
        <label class="btn btn-tech btn-sm w-50 m-0 cursor-pointer">
          <i class="bi bi-upload"></i> Tải ảnh Local
          <input type="file" id="fileInput" accept="image/*" multiple onchange="app.uploadLocalPhotos(event)" hidden>
        </label>
      </div>
    </div>

    <!-- CỘT PHẢI -->
    <div class="right-panel">
      <div class="d-flex justify-content-between align-items-center w-100 mb-2">
        <div>
          <span class="text-uppercase fw-bold" style="color: var(--accent); letter-spacing: 1px;"><i class="bi bi-layout-wtf"></i> Bố cục Trang in</span>
          <br><small class="text-muted" id="orientationBadge">Hướng giấy: Ngang</small>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-tech btn-sm px-3" onclick="app.clearLayout()">Làm mới Layout</button>
          <button class="btn btn-tech-primary px-4 shadow" onclick="app.print()"><i class="bi bi-printer"></i> LỆNH IN</button>
        </div>
      </div>

      <!-- Toolbar chỉnh sửa ảnh -->
      <div class="slot-toolbar d-flex gap-3 align-items-center w-100 justify-content-center" id="slotToolbar">
        <span class="badge bg-primary fs-6">#<span id="stIndex">1</span></span>
        <button class="btn btn-sm btn-outline-light rounded-circle" onclick="app.rotateActiveSlot()" title="Xoay"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="btn btn-sm btn-outline-danger rounded-circle" onclick="app.removeActiveSlot()" title="Xóa"><i class="bi bi-trash"></i></button>
        
        <div class="d-flex align-items-center gap-1">
          <i class="bi bi-brightness-high text-warning"></i>
          <input type="range" class="form-range" id="stBr" min="50" max="150" value="100" style="width: 80px;" oninput="app.applyDirectEdit()">
        </div>
        
        <div class="d-flex align-items-center gap-1">
          <i class="bi bi-circle-half text-info"></i>
          <input type="range" class="form-range" id="stCt" min="50" max="150" value="100" style="width: 80px;" oninput="app.applyDirectEdit()">
        </div>
      </div>

      <!-- Vùng Canvas -->
      <div class="canvas-container">
        <div class="canvas-wrapper">
          <canvas id="finalCanvas" 
                  ondragover="app.allowDrop(event)" 
                  ondrop="app.handleCanvasDrop(event)"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- OFFCANVAS CÀI ĐẶT -->
  <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="settingsOffcanvas" style="width: 400px; background: var(--bg-color) !important; border-left: 1px solid var(--border-color);">
    <div class="offcanvas-header border-bottom" style="border-color: var(--border-color) !important;">
      <h5 class="offcanvas-title fw-bold text-uppercase" style="color: var(--accent);">Bảng Điều Khiển</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      
      <!-- Giao diện Web -->
      <div class="mb-4">
        <h6 class="fw-bold text-secondary border-bottom pb-1 mb-3">1. GIAO DIỆN & BRANDING</h6>
        <div class="mb-2">
          <label class="form-label small m-0 text-muted">Tên Webapp</label>
          <input type="text" id="webTitle" class="form-control form-control-sm bg-transparent text-white border-secondary" value="PRO PHOTOBOOTH STUDIO" oninput="document.getElementById('headerTitleText').innerText = this.value">
        </div>
        <div class="mb-2">
          <label class="form-label small m-0 text-muted">Mã màu chủ đạo (Neon Accent)</label>
          <input type="color" id="bgColor" class="form-control form-control-color w-100 p-1 border-secondary" value="#0ea5e9" onchange="app.changeAppColor(this.value)">
        </div>
        <div>
          <label class="small text-muted m-0">Logo Header Web</label>
          <input type="file" class="form-control form-control-sm bg-transparent text-white border-secondary" accept="image/*" onchange="app.loadHeaderLogo(event)">
        </div>
      </div>

      <div class="mb-4">
        <h6 class="fw-bold text-secondary border-bottom pb-1 mb-3">2. HỆ THỐNG VÀ BỐ CỤC</h6>
        <label class="small text-muted m-0">Đồng bộ Folder Drive (Nhập ID Thư mục)</label>
        <input type="text" id="driveFolderId" class="form-control form-control-sm bg-transparent text-info border-secondary mb-3" value="1XHkRPdZ0F4kchpQHFADJAghILE6Zpqpv" onchange="app.fetchFolderImages()">

        <select id="layoutSelect" class="form-select form-select-sm mb-3 bg-transparent text-white border-secondary" onchange="app.changeLayout()">
          <option value="1" class="text-dark">10x15 cm (1 ảnh) - Ngang</option>
          <option value="2" class="text-dark">6x9 cm (2 ô) - Dọc</option>
          <option value="4" selected class="text-dark">4x6 cm (4 ô) - Ngang</option>
          <option value="8" class="text-dark">3x4 cm (8 ô) - Ngang</option>
        </select>
        
        <div class="row g-2">
          <div class="col-6">
             <label class="small text-muted">Số lượng chụp</label>
             <input type="number" id="photoCount" class="form-control form-control-sm bg-transparent text-white border-secondary" value="1" min="1" max="10">
          </div>
          <div class="col-6">
             <label class="small text-muted">Đếm ngược (s)</label>
             <input type="number" id="timerCount" class="form-control form-control-sm bg-transparent text-white border-secondary" value="3" min="0" max="10">
          </div>
        </div>
      </div>

      <div class="mb-4">
        <h6 class="fw-bold text-secondary border-bottom pb-1 mb-3">3. WATERMARK ẢNH IN</h6>
        <input type="text" id="wmText" class="form-control form-control-sm mb-2 bg-transparent text-white border-secondary" placeholder="Nội dung watermark..." onkeyup="app.renderCanvas()">
        <div class="row g-2 mb-2">
          <div class="col-6">
            <select id="wmFont" class="form-select form-select-sm bg-transparent text-white border-secondary" onchange="app.renderCanvas()">
              <option value="Arial" class="text-dark">Arial</option>
              <option value="Times New Roman" class="text-dark">Times New Roman</option>
              <option value="Impact" class="text-dark">Impact</option>
            </select>
          </div>
          <div class="col-6">
            <select id="wmAlign" class="form-select form-select-sm bg-transparent text-white border-secondary" onchange="app.renderCanvas()">
              <option value="center" class="text-dark">Căn Giữa</option>
              <option value="left" class="text-dark">Căn Trái</option>
              <option value="right" class="text-dark">Căn Phải</option>
            </select>
          </div>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6 d-flex align-items-center gap-2">
            <input type="color" id="wmColor" class="form-control form-control-color p-0 border-0" value="#ffffff" onchange="app.renderCanvas()" style="width:25px; height:25px;">
            <span class="small text-muted">Màu chữ</span>
          </div>
          <div class="col-6 d-flex align-items-center gap-2">
            <input type="color" id="wmOutline" class="form-control form-control-color p-0 border-0" value="#000000" onchange="app.renderCanvas()" style="width:25px; height:25px;">
            <span class="small text-muted">Viền chữ</span>
          </div>
        </div>
        <label class="small text-muted">Logo dán lên ảnh (Trong suốt)</label>
        <input type="file" class="form-control form-control-sm bg-transparent text-white border-secondary" accept="image/*" onchange="app.loadPrintLogo(event)">
      </div>
      
    </div>
  </div>

  <script>
    // URL API (Đã điền link của bạn)
    const API_URL = 'https://script.google.com/macros/s/AKfycby6_-gotKSFnMsAsvC_TXmqCEeibp339208kcTpuKF8c9DsSMH1WQ05U00MwlztEqRfYg/exec'; 

    const app = {
      video: document.getElementById('videoElement'),
      canvas: document.getElementById('finalCanvas'),
      ctx: document.getElementById('finalCanvas').getContext('2d'),
      stream: null,
      
      cloudPhotos: [], // Ảnh đồng bộ từ folder
      capturedPhotos: [], // Ảnh vừa chụp local
      layoutSlots: [], 
      
      printLogo: null,
      cameraMode: 'horizontal', 
      isLandscape: true,
      dragPayload: null,
      isDarkMode: true,

      activeSlotIndex: -1,
      isPanning: false,
      startX: 0,
      startY: 0,

      totalToUpload: 0,
      totalUploaded: 0,

      init: async function() {
        await this.loadDeviceList();
        this.startCamera();
        this.changeLayout();
        this.bindCanvasEvents();
        
        // Tự động fetch ảnh từ thư mục Drive khi tải trang
        this.fetchFolderImages();
      },

      /* --- QUẢN LÝ GIAO DIỆN WEB --- */
      toggleTheme: function() {
        this.isDarkMode = !this.isDarkMode;
        document.documentElement.setAttribute('data-bs-theme', this.isDarkMode ? 'dark' : 'light');
        document.getElementById('themeIcon').className = this.isDarkMode ? 'bi bi-moon-stars' : 'bi bi-sun';
      },
      changeAppColor: function(hex) {
        // Cập nhật biến màu Accent cho toàn hệ thống
        document.documentElement.style.setProperty('--accent', hex);
        // Chuyển hex sang rgba cho border
        const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        document.documentElement.style.setProperty('--accent-glow', `0 0 15px rgba(${r}, ${g}, ${b}, 0.5)`);
        document.documentElement.style.setProperty('--border-color', `rgba(${r}, ${g}, ${b}, 0.3)`);
      },
      loadHeaderLogo: function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          document.getElementById('headerLogo').src = evt.target.result;
          document.getElementById('headerLogo').style.display = 'block';
        };
        reader.readAsDataURL(file);
      },

      /* --- KẾT NỐI GOOGLE DRIVE --- */
      fetchFolderImages: function() {
        const folderId = document.getElementById('driveFolderId').value.trim();
        if(!folderId) return;
        
        const statusTxt = document.getElementById('cloudStatusText');
        statusTxt.innerText = "Đang đồng bộ dữ liệu Cloud...";
        
        const fd = new URLSearchParams();
        fd.append('action', 'getFolderImages');
        fd.append('folderId', folderId);

        fetch(API_URL, { method: 'POST', body: fd })
          .then(res => res.json())
          .then(res => {
            if(res.success && res.data.length > 0) {
              this.cloudPhotos = [];
              res.data.forEach(b64 => {
                const img = new Image();
                img.onload = () => {
                  this.cloudPhotos.push(img);
                  this.renderGalleries();
                };
                img.src = b64;
              });
            } else {
              statusTxt.innerText = "Thư mục trống hoặc sai ID";
            }
          })
          .catch(() => { statusTxt.innerText = "Lỗi kết nối Cloud"; });
      },

      importFromDriveLink: function() {
        Swal.fire({
          title: 'Tải ảnh từ Link',
          input: 'text',
          inputPlaceholder: 'https://drive.google.com/file/d/...',
          showCancelButton: true,
          confirmButtonText: 'Tải xuống',
          showLoaderOnConfirm: true,
          preConfirm: (url) => {
            const match = url.match(/[-\w]{25,}/);
            if (!match) { Swal.showValidationMessage('Link không hợp lệ.'); return false; }
            
            const fd = new URLSearchParams();
            fd.append('action', 'fetchDrive');
            fd.append('fileId', match[0]);

            return fetch(API_URL, { method: 'POST', body: fd })
              .then(res => res.json())
              .then(res => {
                if (!res.success) throw new Error(res.error);
                return res.data;
              }).catch(err => Swal.showValidationMessage(`Lỗi: ${err}`));
          },
          allowOutsideClick: () => !Swal.isLoading()
        }).then((result) => {
          if (result.isConfirmed && result.value) {
            const imgObj = new Image();
            imgObj.onload = () => {
              this.capturedPhotos.push(imgObj); // Đưa vào khu vực ảnh hiện tại
              this.renderGalleries();
            };
            imgObj.src = result.value;
          }
        });
      },

      /* --- EVENT LISTENER CANVAS D&D --- */
      bindCanvasEvents: function() {
        const cvs = this.canvas;
        cvs.addEventListener('mousedown', (e) => {
          const index = this.getSlotIndexFromEvent(e);
          if(index !== -1 && this.layoutSlots[index]) {
            this.activeSlotIndex = index;
            this.isPanning = true;
            this.startX = e.clientX;
            this.startY = e.clientY;
            this.updateToolbarUI();
            this.renderCanvas(); 
          } else {
            this.activeSlotIndex = -1;
            this.updateToolbarUI();
            this.renderCanvas();
          }
        });

        cvs.addEventListener('mousemove', (e) => {
          if(!this.isPanning || this.activeSlotIndex === -1) return;
          const slot = this.layoutSlots[this.activeSlotIndex];
          const rect = cvs.getBoundingClientRect();
          const scaleX = cvs.width / rect.width;
          const scaleY = cvs.height / rect.height;
          
          slot.panX += (e.clientX - this.startX) * scaleX;
          slot.panY += (e.clientY - this.startY) * scaleY;
          this.startX = e.clientX; this.startY = e.clientY;
          this.renderCanvas();
        });

        window.addEventListener('mouseup', () => { this.isPanning = false; });
        
        cvs.addEventListener('wheel', (e) => {
          e.preventDefault();
          const index = this.getSlotIndexFromEvent(e);
          if(index !== -1 && this.layoutSlots[index]) {
            this.activeSlotIndex = index;
            const slot = this.layoutSlots[index];
            const zoomAmount = e.deltaY > 0 ? -0.05 : 0.05;
            slot.zoom = Math.max(0.5, Math.min(4, slot.zoom + zoomAmount));
            this.updateToolbarUI();
            this.renderCanvas();
          }
        }, { passive: false });

        cvs.addEventListener('dblclick', (e) => {
          const index = this.getSlotIndexFromEvent(e);
          if(index !== -1 && this.layoutSlots[index]) {
            this.layoutSlots[index].rotate = (this.layoutSlots[index].rotate + 90) % 360;
            this.renderCanvas();
          }
        });
      },

      getSlotIndexFromEvent: function(e) {
        const rect = this.canvas.getBoundingClientRect();
        const scaleX = this.canvas.width / rect.width;
        const scaleY = this.canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        const config = this.getLayoutConfig();
        const col = Math.floor(x / (this.canvas.width / config.cols));
        const row = Math.floor(y / (this.canvas.height / config.rows));
        if (col >= 0 && col < config.cols && row >= 0 && row < config.rows) return row * config.cols + col;
        return -1;
      },

      updateToolbarUI: function() {
        const tb = document.getElementById('slotToolbar');
        if (this.activeSlotIndex !== -1 && this.layoutSlots[this.activeSlotIndex]) {
          const slot = this.layoutSlots[this.activeSlotIndex];
          tb.classList.add('active');
          document.getElementById('stIndex').innerText = this.activeSlotIndex + 1;
          document.getElementById('stBr').value = slot.br;
          document.getElementById('stCt').value = slot.ct;
        } else {
          tb.classList.remove('active');
        }
      },

      applyDirectEdit: function() {
        if(this.activeSlotIndex === -1) return;
        const slot = this.layoutSlots[this.activeSlotIndex];
        slot.br = parseInt(document.getElementById('stBr').value);
        slot.ct = parseInt(document.getElementById('stCt').value);
        this.renderCanvas();
      },

      rotateActiveSlot: function() {
        if(this.activeSlotIndex === -1) return;
        this.layoutSlots[this.activeSlotIndex].rotate = (this.layoutSlots[this.activeSlotIndex].rotate + 90) % 360;
        this.renderCanvas();
      },
      removeActiveSlot: function() {
        if(this.activeSlotIndex === -1) return;
        this.layoutSlots[this.activeSlotIndex] = null;
        this.activeSlotIndex = -1;
        this.updateToolbarUI();
        this.renderCanvas();
      },

      uploadLocalPhotos: function(e) {
        const files = e.target.files;
        for(let file of files) {
          if(!file.type.startsWith('image/')) continue;
          const reader = new FileReader();
          reader.onload = (evt) => {
            const img = new Image();
            img.onload = () => { this.capturedPhotos.push(img); this.renderGalleries(); };
            img.src = evt.target.result;
          };
          reader.readAsDataURL(file);
        }
      },

      /* --- CAMERA 4K --- */
      loadDeviceList: async function() {
        try {
          await navigator.mediaDevices.getUserMedia({ video: true });
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(d => d.kind === 'videoinput');
          const select = document.getElementById('cameraSelect');
          select.innerHTML = '';
          videoDevices.forEach((d, i) => select.appendChild(new Option(d.label || `Camera ${i+1}`, d.deviceId)));
        } catch (err) {}
      },

      startCamera: async function() {
        const deviceId = document.getElementById('cameraSelect').value;
        if (this.stream) this.stream.getTracks().forEach(track => track.stop());
        try {
          const constraints = { video: deviceId ? { deviceId: { exact: deviceId }, width: { ideal: 4096 }, height: { ideal: 2160 } } : { facingMode: "user", width: { ideal: 4096 }, height: { ideal: 2160 } } };
          this.stream = await navigator.mediaDevices.getUserMedia(constraints);
          this.video.srcObject = this.stream;
        } catch (err) {}
      },
      switchCamera: function() { this.startCamera(); },
      setCameraMode: function(mode) {
        this.cameraMode = mode;
        const wp = document.getElementById('viewport');
        document.getElementById('btnModeH').classList.remove('active');
        document.getElementById('btnModeV').classList.remove('active');
        if(mode === 'horizontal') {
          wp.classList.remove('vertical');
          this.video.style.transform = 'rotate(0deg)';
          document.getElementById('btnModeH').classList.add('active');
        } else {
          wp.classList.add('vertical');
          this.video.style.transform = 'rotate(90deg)';
          document.getElementById('btnModeV').classList.add('active');
        }
      },

      startCaptureSession: async function() {
        const count = parseInt(document.getElementById('photoCount').value);
        const timer = parseInt(document.getElementById('timerCount').value);
        const vp = document.getElementById('viewport');
        const overlay = document.getElementById('countdownOverlay');

        for (let i = 0; i < count; i++) {
          overlay.style.display = 'flex';
          for (let t = timer; t > 0; t--) { overlay.innerText = t; await new Promise(r => setTimeout(r, 1000)); }
          overlay.style.display = 'none';
          
          vp.style.backgroundColor = '#fff';
          this.video.style.opacity = 0;
          setTimeout(() => { vp.style.backgroundColor = '#000'; this.video.style.opacity = 1; }, 100);
          
          this.captureSingleFrame();
          if(i < count - 1) await new Promise(r => setTimeout(r, 1000));
        }
      },

      captureSingleFrame: function() {
        const tCanvas = document.createElement('canvas');
        const tCtx = tCanvas.getContext('2d');
        
        if (this.cameraMode === 'vertical') {
          tCanvas.width = this.video.videoHeight; tCanvas.height = this.video.videoWidth;
          tCtx.translate(tCanvas.width/2, tCanvas.height/2); tCtx.rotate(Math.PI/2);
          tCtx.drawImage(this.video, -this.video.videoWidth/2, -this.video.videoHeight/2);
        } else {
          tCanvas.width = this.video.videoWidth; tCanvas.height = this.video.videoHeight;
          tCtx.drawImage(this.video, 0, 0);
        }

        const b64 = tCanvas.toDataURL('image/jpeg', 1.0); // 1.0 = Max quality
        const imgObj = new Image();
        imgObj.onload = () => {
          this.capturedPhotos.push(imgObj);
          this.renderGalleries();
          this.autoFillFirstEmptySlot(imgObj);
        };
        imgObj.src = b64;
        this.uploadToDrive(b64);
      },

      uploadToDrive: function(base64) {
        this.totalToUpload++;
        document.getElementById('uploadStatusUI').style.setProperty('display', 'flex', 'important');
        this.updateUploadUI();

        const fd = new URLSearchParams();
        fd.append('image', base64);
        fd.append('fileName', 'Capture_' + new Date().getTime() + '.jpg');

        fetch(API_URL, { method: 'POST', body: fd })
          .then(r => r.json())
          .then(r => { if(r.success) this.totalUploaded++; this.updateUploadUI(); })
          .catch(() => this.updateUploadUI());
      },
      updateUploadUI: function() {
        document.getElementById('uploadCount').innerText = `${this.totalUploaded}/${this.totalToUpload}`;
        let percent = this.totalToUpload > 0 ? Math.round((this.totalUploaded/this.totalToUpload)*100) : 0;
        document.getElementById('uploadProgress').style.width = percent + '%';
        if(this.totalUploaded === this.totalToUpload && this.totalToUpload > 0) {
          setTimeout(() => { document.getElementById('uploadStatusUI').style.setProperty('display', 'none', 'important'); }, 2000);
        }
      },

      /* --- GIAO DIỆN CHUNG --- */
      renderGalleries: function() {
        // Cloud
        const cloud = document.getElementById('cloudGallery'); cloud.innerHTML = '';
        this.cloudPhotos.forEach((img) => cloud.appendChild(this.createThumb(img)));
        if(this.cloudPhotos.length === 0) cloud.innerHTML = '<span class="text-muted small w-100 text-center" id="cloudStatusText">Chưa có ảnh trên Drive</span>';

        // Captured
        const cap = document.getElementById('capturedGallery'); cap.innerHTML = '';
        this.capturedPhotos.forEach((img) => cap.appendChild(this.createThumb(img)));
        if(this.capturedPhotos.length === 0) cap.innerHTML = '<span class="text-muted small w-100 text-center">Trống</span>';
      },

      createThumb: function(imgObj) {
        const img = document.createElement('img');
        img.src = imgObj.src; img.className = 'thumb-item'; img.draggable = true;
        img.ondragstart = () => { this.dragPayload = imgObj; };
        return img;
      },

      allowDrop: function(e) { e.preventDefault(); },
      handleCanvasDrop: function(e) {
        e.preventDefault();
        if(!this.dragPayload) return;
        const index = this.getSlotIndexFromEvent(e);
        if(index !== -1) {
          this.setSlotObject(index, this.dragPayload);
          this.activeSlotIndex = index;
          this.updateToolbarUI();
          this.renderCanvas();
        }
        this.dragPayload = null;
      },

      autoFillFirstEmptySlot: function(imgObj) {
        const conf = this.getLayoutConfig();
        for(let i=0; i<conf.cols * conf.rows; i++) {
          if(!this.layoutSlots[i]) { this.setSlotObject(i, imgObj); this.renderCanvas(); break; }
        }
      },

      setSlotObject: function(index, imgObj) {
        this.layoutSlots[index] = { img: imgObj, zoom: 1, panX: 0, panY: 0, rotate: 0, br: 100, ct: 100 };
      },

      getLayoutConfig: function() {
        const val = parseInt(document.getElementById('layoutSelect').value);
        if(val === 2) return { cols: 1, rows: 2 };
        if(val === 4) return { cols: 2, rows: 2 };
        if(val === 8) return { cols: 4, rows: 2 };
        return { cols: 1, rows: 1 };
      },

      changeLayout: function() {
        const val = parseInt(document.getElementById('layoutSelect').value);
        this.layoutSlots = new Array(val).fill(null);
        this.activeSlotIndex = -1;
        this.updateToolbarUI();
        
        const badge = document.getElementById('orientationBadge');
        const ps = document.getElementById('printStyle');

        if (val === 2) {
          this.canvas.width = 1200; this.canvas.height = 1800; this.isLandscape = false;
          badge.innerText = 'Hướng giấy: Dọc (Portrait)';
          ps.innerHTML = `@media print { @page { size: 4in 6in; margin: 0; } }`;
        } else {
          this.canvas.width = 1800; this.canvas.height = 1200; this.isLandscape = true;
          badge.innerText = 'Hướng giấy: Ngang (Landscape)';
          ps.innerHTML = `@media print { @page { size: 6in 4in; margin: 0; } }`;
        }
        this.renderCanvas();
      },
      clearLayout: function() { this.changeLayout(); },

      /* --- RENDER CANVAS MASKING TRỰC TIẾP --- */
      renderCanvas: function() {
        const cw = this.canvas.width; const ch = this.canvas.height;
        this.ctx.clearRect(0, 0, cw, ch);
        this.ctx.fillStyle = "#ffffff";
        this.ctx.fillRect(0, 0, cw, ch);

        const config = this.getLayoutConfig();
        const cellW = cw / config.cols; const cellH = ch / config.rows;
        const text = document.getElementById('wmText').value;

        for(let r = 0; r < config.rows; r++) {
          for(let c = 0; c < config.cols; c++) {
            const index = r * config.cols + c;
            const slot = this.layoutSlots[index];
            const x = c * cellW; const y = r * cellH;

            if (slot) {
              this.ctx.save();
              this.ctx.beginPath();
              this.ctx.rect(x, y, cellW, cellH);
              this.ctx.clip(); 

              this.ctx.filter = `brightness(${slot.br}%) contrast(${slot.ct}%)`;

              const imgRatio = slot.img.width / slot.img.height;
              const isRotated = (slot.rotate === 90 || slot.rotate === 270);
              let targetRatio = isRotated ? (cellH / cellW) : (cellW / cellH);
              
              let drawW = cellW, drawH = cellH;
              if (imgRatio > targetRatio) { drawW = cellH * imgRatio; } 
              else { drawH = cellW / imgRatio; }
              
              if(isRotated) {
                if (imgRatio > (cellH/cellW)) { drawH = cellW; drawW = cellW * imgRatio; } 
                else { drawW = cellH; drawH = cellH / imgRatio; }
              }

              const centerX = x + cellW / 2; const centerY = y + cellH / 2;
              this.ctx.translate(centerX, centerY);
              this.ctx.translate(slot.panX, slot.panY); 
              this.ctx.scale(slot.zoom, slot.zoom);     
              this.ctx.rotate(slot.rotate * Math.PI / 180); 
              
              this.ctx.drawImage(slot.img, -drawW / 2, -drawH / 2, drawW, drawH);
              this.ctx.restore(); 

            } else {
              this.ctx.fillStyle = "#f1f5f9"; this.ctx.fillRect(x, y, cellW, cellH);
              this.ctx.fillStyle = "#94a3b8"; this.ctx.font = "24px Arial"; this.ctx.textAlign = "center"; this.ctx.textBaseline = "middle";
              this.ctx.fillText("Kéo thả ảnh vào", x + cellW/2, y + cellH/2);
            }
            
            // Vẽ viền khi chọn
            if (this.activeSlotIndex === index) {
              this.ctx.strokeStyle = "rgba(14, 165, 233, 0.8)";
              this.ctx.lineWidth = 15;
              this.ctx.strokeRect(x, y, cellW, cellH);
            } else {
              this.ctx.strokeStyle = "#cbd5e1";
              this.ctx.lineWidth = 2;
              this.ctx.setLineDash([10, 10]); 
              this.ctx.strokeRect(x, y, cellW, cellH);
              this.ctx.setLineDash([]); 
            }

            if (this.printLogo) {
              const logoW = cellW * 0.2; const logoH = (this.printLogo.height / this.printLogo.width) * logoW;
              this.ctx.drawImage(this.printLogo, x + 20, y + 20, logoW, logoH);
            }
            if (text) {
              const fontSize = cellH * 0.05;
              this.ctx.font = `bold ${fontSize}px ${document.getElementById('wmFont').value}`;
              this.ctx.fillStyle = document.getElementById('wmColor').value;
              this.ctx.strokeStyle = document.getElementById('wmOutline').value;
              this.ctx.lineWidth = 4; this.ctx.textBaseline = "bottom";
              const align = document.getElementById('wmAlign').value;
              this.ctx.textAlign = align;
              let textX = x; const textY = y + cellH - 30;
              if(align === "center") textX = x + (cellW / 2);
              else if(align === "left") textX = x + 30;
              else if(align === "right") textX = x + cellW - 30;
              this.ctx.strokeText(text, textX, textY);
              this.ctx.fillText(text, textX, textY);
            }
          }
        }
      },

      print: function() { 
        this.activeSlotIndex = -1; 
        this.updateToolbarUI();
        this.renderCanvas();
        setTimeout(() => { window.print(); }, 300);
      },
      
      loadPrintLogo: function(e) {
        if(!e.target.files[0]) return;
        const r = new FileReader();
        r.onload = (evt) => { const img = new Image(); img.onload = () => { this.printLogo = img; this.renderCanvas(); }; img.src = evt.target.result; }
        r.readAsDataURL(e.target.files[0]);
      }
    };

    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
